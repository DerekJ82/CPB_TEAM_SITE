<script>
/* ===========================================================================
   MICROSITE UI - behaviour (verbatim from Basic Microsite UI/app.js)
   =========================================================================== */
(function () {
  'use strict';

  var SECTION = null;
  var TAB = null;

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }

  function still() {
    return window.matchMedia('(prefers-reduced-motion:reduce)').matches ||
           document.hidden;
  }

  function openSection(key, tab) {
    SECTION = key;
    $('#greeter').hidden = true;
    $('#portal').hidden = false;

    var row = $('#navRow');
    var tabs = $$('[data-section="' + key + '"]', $('#tabData'));
    row.innerHTML = tabs.map(function (t) {
      return '<button class="nav-tab" data-tab="' + t.getAttribute('data-tab') +
             '">' + t.getAttribute('data-label') + '</button>';
    }).join('');
    $$('.nav-tab', row).forEach(function (b) {
      b.addEventListener('click', function () { showTab(b.getAttribute('data-tab')); });
    });

    markNavWrap();
    showTab(tab || tabs[0].getAttribute('data-tab'));
    window.scrollTo(0, 0);
  }

  function goHome() {
    $('#portal').hidden = true;
    $('#greeter').hidden = false;
    $('.nav').classList.remove('open');
    history.replaceState(null, '', window.location.pathname + window.location.search);
    requestAnimationFrame(function () {
      var t = $('#grStart');
      if (t) t.scrollIntoView(still() ? undefined : { behavior: 'smooth', block: 'start' });
    });
  }

  function showTab(tab) {
    TAB = tab;

    $$('.nav-tab').forEach(function (b) {
      var on = b.getAttribute('data-tab') === tab;
      b.classList.toggle('active', on);
      if (on) { var c = $('#navCurrent'); if (c) c.textContent = b.textContent; }
    });

    $$('.tabview').forEach(function (v) { v.hidden = true; });
    var view = $('#view-' + tab);
    if (view) {
      view.hidden = false;
      initReveal(view);
    }
    if (tab === 'roster') initRosterMap();

    $('.nav').classList.remove('open');
    window.scrollTo(0, 0);
    if (onScroll) onScroll();

    // Persist current location so a refresh restores this tab
    if (SECTION) {
      history.replaceState(null, '', '#' + SECTION + '/' + tab);
    }
  }

  function markNavWrap() {
    var row = $('#navRow');
    if (!row) return;
    var tabs = $$('.nav-tab', row);
    var wrapped = false;
    if (tabs.length > 1) {
      var top0 = tabs[0].offsetTop;
      for (var i = 1; i < tabs.length; i++) {
        if (Math.abs(tabs[i].offsetTop - top0) > 2) { wrapped = true; break; }
      }
    }
    row.classList.toggle('wrapped', wrapped);
    var shell = $('.nav-shell');
    if (shell) shell.classList.toggle('wrapped', wrapped);

    var nav = $('.nav');
    var h = Math.round(nav.getBoundingClientRect().height) || 72;
    document.documentElement.style.setProperty('--navh', h + 'px');
    if (onScroll) onScroll();
  }

  function initReveal(root) {
    var els = $$('.reveal', root);
    if (still() || !('IntersectionObserver' in window)) {
      els.forEach(function (e) { e.classList.add('in'); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        en.target.classList.add('in');
        io.unobserve(en.target);
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0 });
    els.forEach(function (e) {
      if (!e.classList.contains('in')) io.observe(e);
    });
  }

  function swapTo(wrapId, index, btn) {
    var wrap = document.getElementById(wrapId);
    if (!wrap) return;
    $$('.swap-b', wrap).forEach(function (b) { b.classList.toggle('on', b === btn); });
    $$('.swap-p', wrap).forEach(function (p) {
      p.classList.toggle('on', Number(p.getAttribute('data-i')) === index);
    });
    if (onScroll) onScroll();
  }

  function expandTo(id) {
    var card = document.getElementById(id);
    if (!card) return;
    var btn = $('.gexp-hd', card), pane = $('.gexp-p', card);
    var open = card.classList.toggle('on');
    if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (pane) pane.style.maxHeight = open ? (pane.scrollHeight + 'px') : '';
    if (onScroll) onScroll();
  }

  var onScroll = null;

  function initScrollBtn() {
    var btn = $('#scrollBtn');
    if (!btn) return;

    onScroll = function () {
      if ($('#portal').hidden) { btn.classList.remove('on'); return; }

      var y = window.scrollY || document.documentElement.scrollTop;
      var max = document.documentElement.scrollHeight - window.innerHeight;
      var next = nextTab();

      var noScroll = max <= 10;
      var shortPage = max < window.innerHeight;
      var atEnd = noScroll || shortPage || (max - y) < 120;

      btn.classList.toggle('on', (noScroll || shortPage) ? !!next : (y > 260));

      if (atEnd && next) {
        btn.classList.add('next');
        btn.innerHTML = 'Next section <i>&rarr;</i>';
        btn.setAttribute('aria-label', 'Go to the next section');
      } else {
        btn.classList.remove('next');
        btn.innerHTML = '<i>&uarr;</i> Back to top';
        btn.setAttribute('aria-label', 'Back to top');
      }
    };

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);

    btn.addEventListener('click', function () {
      if (btn.classList.contains('next')) {
        var n = nextTab();
        if (n) showTab(n);
      } else {
        window.scrollTo(still() ? { top: 0 } : { top: 0, behavior: 'smooth' });
      }
    });
    onScroll();
  }

  function nextTab() {
    var list = $$('.nav-tab').map(function (b) { return b.getAttribute('data-tab'); });
    var i = list.indexOf(TAB);
    return (i > -1 && i < list.length - 1) ? list[i + 1] : null;
  }

  // Apply survey response data to roster and pet cards.
  // TEAM_CARD_DATA and PET_CARD_DATA are injected by doGet as name-keyed JSON objects.
  function applySyncedCardData() {
    var cardData = window.TEAM_CARD_DATA;
    if (cardData && typeof cardData === 'object') {
      $$('#team-cards-data .team-card').forEach(function (card) {
        var nameEl = card.querySelector('.team-name');
        if (!nameEl) return;

        var synced = cardData[nameEl.textContent.trim().toLowerCase()];
        if (!synced) return;

        // Merge synced fields, preserving any values already in the HTML
        var existing = {};
        try { existing = JSON.parse(card.getAttribute('data-card') || '{}'); } catch (e) {}

        function _v(s, e) { return (s && s !== '?') ? s : (e || '?'); }
        card.setAttribute('data-card', JSON.stringify({
          song:    _v(synced.song,    existing.song),
          gateway: _v(synced.gateway, existing.gateway),
          report:  _v(synced.report,  existing.report),
          meal:    _v(synced.meal,    existing.meal),
          turf:    _v(synced.turf,    existing.turf),
          rookie:  _v(synced.rookie,  existing.rookie)
        }));
      });
    }

    var petData = window.PET_CARD_DATA;
    if (petData && typeof petData === 'object') {
      $$('#view-furry-friends .pet-card').forEach(function (card) {
        var deptEl = card.querySelector('.team-dept');
        if (!deptEl) return;

        // Extract owner first name from "Owner: Arleen"
        var ownerText = deptEl.textContent.replace('Owner:', '').trim().toLowerCase();
        var synced = petData[ownerText];
        if (!synced) return;

        if (synced.bio)     card.setAttribute('data-bio', synced.bio);
        if (synced.petName) { var nameEl = card.querySelector('.team-name'); if (nameEl) nameEl.textContent = synced.petName; }
        if (synced.role)    { var roleEl = card.querySelector('.team-role'); if (roleEl) roleEl.textContent = synced.role; }
      });
    }
  }

  function boot() {
    $$('.ws-card').forEach(function (card) {
      if (!card.getAttribute('data-section')) return;
      card.addEventListener('click', function () {
        openSection(card.getAttribute('data-section'));
      });
    });

    var chev = $('#grChev');
    if (chev) chev.addEventListener('click', function () {
      var t = $('#grStart');
      if (t) t.scrollIntoView(still() ? undefined : { behavior: 'smooth', block: 'start' });
    });

    ['#navHome', '#navHomeM'].forEach(function (sel) {
      var el = $(sel);
      if (el) el.addEventListener('click', goHome);
    });

    var burger = $('#navBurger');
    if (burger) burger.addEventListener('click', function () {
      $('.nav').classList.toggle('open');
    });

    $$('.swap-b').forEach(function (b) {
      b.addEventListener('click', function () {
        swapTo(b.getAttribute('data-wrap'), Number(b.getAttribute('data-i')), b);
      });
    });

    $$('.gexp-hd').forEach(function (b) {
      b.addEventListener('click', function () {
        expandTo(b.closest('.gexp').id);
      });
    });

    window.addEventListener('scroll', function () {
      $('.nav').classList.toggle('solid', (window.scrollY || 0) > 12);
    }, { passive: true });

    window.addEventListener('resize', markNavWrap);

    initScrollBtn();
    initReveal(document);
    applySyncedCardData();

    // Restore section/tab from hash on load (e.g. #team/roster)
    var hash = window.location.hash.replace('#', '');
    if (hash) {
      var parts   = hash.split('/');
      var section = parts[0];
      var tab     = parts[1] || null;
      var sectionTabs = $$('[data-section="' + section + '"]', $('#tabData'));
      if (sectionTabs.length) {
        openSection(section, tab);
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();


/* ===========================================================================
   EPB Team Site — pipeline tabs + admin section
   =========================================================================== */
(function () {
  'use strict';

  /* --- Admin tab removal -------------------------------------------------- */
  if (!window.IS_ADMIN) {
    var adminEl = document.querySelector('#tabData i[data-admin]');
    if (adminEl) adminEl.parentNode.removeChild(adminEl);
  }

  /* --- Helpers ------------------------------------------------------------ */
  function _esc(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function _badge(status) {
    var cls = { COMPLETE:'ok', PASS:'ok', SUCCESS:'ok',
                IN_PROGRESS:'warn', WAITING:'warn', ACTIVE:'warn',
                PENDING:'todo', NOT_STARTED:'todo',
                FAILED:'bad', DENIED:'bad', FAIL:'bad' };
    var key = String(status).toUpperCase();
    return '<span class="pbadge ' + (cls[key] || 'todo') + '">' + _esc(status) + '</span>';
  }

  function _err(id, msg) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = '<p class="pipe-error">' + _esc(String(msg)) + '</p>';
  }

  /* --- Tab observer ------------------------------------------------------- */
  function observeTab(id, fn) {
    var el = document.getElementById(id);
    if (!el) return;
    var done = false;
    new MutationObserver(function () {
      if (!el.hidden && !done) { done = true; fn(); }
    }).observe(el, { attributes: true, attributeFilter: ['hidden'] });
  }

  /* --- Pipeline data (shared across PSO / Queries) ----------------------- */
  var _pipeData    = null;
  var _pipeLoading = false;
  var _pipeCbs     = [];

  function _loadPipeData(cb) {
    if (_pipeData) { cb(_pipeData); return; }
    _pipeCbs.push(cb);
    if (_pipeLoading) return;
    _pipeLoading = true;
    google.script.run
      .withSuccessHandler(function (d) {
        _pipeData    = d;
        _pipeLoading = false;
        var cbs = _pipeCbs.slice(); _pipeCbs = [];
        cbs.forEach(function (fn) { fn(d); });
      })
      .withFailureHandler(function (e) {
        _pipeLoading = false;
        var cbs = _pipeCbs.slice(); _pipeCbs = [];
        var msg = 'Error loading pipeline data: ' + String(e);
        cbs.forEach(function (fn) { fn({ _error: msg }); });
      })
      .getDashboardData();
  }

  /* --- Queries tab -------------------------------------------------------- */
  observeTab('view-queries', function () {
    var el = document.getElementById('queries-body');
    if (el && !_pipeData) el.innerHTML = '<p class="pipe-loading">Loading pipeline data&hellip;</p>';
    _loadPipeData(renderQueries);
  });

  function renderQueries(data) {
    var el = document.getElementById('queries-body');
    if (!el) return;
    if (data._error) { el.innerHTML = '<p class="pipe-error">' + _esc(data._error) + '</p>'; return; }
    var d = data.queries;
    if (!d || d.error) { el.innerHTML = '<p class="pipe-error">' + _esc(d ? d.error : 'No queries data') + '</p>'; return; }

    // CONFIG sheet not yet initialized
    if (!d.currentPeriod) {
      el.innerHTML =
        '<div class="gnote reveal">' +
          '<span class="dsr-icon" aria-hidden="true">!</span>' +
          '<div><h4 class="gnote-h">Config not initialized</h4>' +
          '<p class="gnote-p">Run <code>initBRConfigSheet()</code> from the Apps Script editor, ' +
          'then <code>scheduleMonthlyBRNotification()</code> to set the current period.</p></div>' +
        '</div>' +
        '<p class="pipe-link"><a href="' + _esc(d.trackerUrl || '#') + '" target="_blank" rel="noopener">Open tracker sheet &rarr;</a></p>';
      return;
    }

    // Step badge/note helpers
    function stepBadge(i) {
      if (d.stage === 3 && d.pipelineStatus === 'SUCCESS') return _badge('COMPLETE');
      if (d.stage === 3 && d.pipelineStatus !== 'SUCCESS' && i === 2) return _badge('FAILED');
      if (i < d.stage)  return _badge('COMPLETE');
      if (i === d.stage) return _badge('IN_PROGRESS');
      return _badge('NOT_STARTED');
    }
    function stepNote(i) {
      var ts = '';
      if (i === 0 && d.preRunSent)      ts = _fmtTs(d.preRunSent);
      if (i === 1)                       ts = d.queriesComplete ? '4th at 09:00 ET' : 'Scheduled for the 4th';
      if (i === 2 && d.queriesComplete)  ts = _fmtTs(d.queriesComplete);
      if (i === 3 && d.postRunChecked)   ts = _fmtTs(d.postRunChecked);
      return ts ? '<p>' + _esc(ts) + '</p>' : '';
    }

    var stepLabels = ['Reminder Sent', 'Queries &amp; Workflow', 'Results Checked', 'Pipeline Complete'];
    var steps = stepLabels.map(function(label, i) {
      return '<li class="step">' +
        '<span class="step-n">' + (i + 1) + '</span>' +
        '<div><h4>' + label + ' &nbsp;' + stepBadge(i) + '</h4>' + stepNote(i) + '</div>' +
      '</li>';
    }).join('');

    var tableRows = (d.tables || []).map(function(t) {
      var status = !t.maxMonth ? 'NOT_STARTED' : t.pass ? 'PASS' : 'FAILED';
      return '<tr>' +
        '<td>' + _esc(t.name) + '</td>' +
        '<td class="gt-prose" style="font-size:12px;color:var(--grey-l);font-style:italic">' + _esc(t.bqId || '') + '</td>' +
        '<td class="num">' + _esc(t.maxMonth || '—') + '</td>' +
        '<td>' + _badge(status) + '</td>' +
      '</tr>';
    }).join('');

    var failNote = (d.stage === 3 && d.pipelineStatus !== 'SUCCESS')
      ? '<div class="gnote reveal"><span class="dsr-icon" aria-hidden="true">!</span>' +
        '<div><h4 class="gnote-h">Pipeline issue detected</h4>' +
        '<p class="gnote-p">Post-run check found one or more BQ tables did not update to ' +
        _esc(_fmtPeriod(d.currentPeriod)) + '. Review table status below and check the GCP workflow.</p></div></div>'
      : '';

    var controls =
      '<div class="reveal" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:8px">' +
        '<button class="action-btn approve" onclick="window._brMarkReminder(this)">Mark Reminder Sent</button>' +
        '<button class="action-btn approve" onclick="window._brMarkQueries(this)">Mark Queries Done</button>' +
        '<button class="action-btn" style="background:var(--purple);color:#fff;border:0" ' +
          'onclick="window._brRunCheck(this)">Run Post-Run Check Now</button>' +
      '</div>';

    var pct = Math.round((d.stage / (d.totalStages || 4)) * 100);

    el.innerHTML =
      '<div class="gstats reveal">' +
        '<div class="gstat"><b>' + _esc(_fmtPeriod(d.currentPeriod)) + '</b><span>Current period</span></div>' +
        '<div class="gstat"><b>Stage ' + d.stage + '&thinsp;/&thinsp;' + (d.totalStages || 4) +
          '</b><span>Pipeline stage</span></div>' +
        '<div class="gstat">' + _badge(d.pipelineStatus || 'PENDING') + '<span>Status</span></div>' +
      '</div>' +
      '<div class="pipe-progress reveal"><div class="pipe-bar" style="width:' + pct + '%"></div></div>' +
      failNote +
      '<ul class="steps reveal">' + steps + '</ul>' +
      '<div class="gt-wrap reveal"><table class="gt gt-wide">' +
        '<thead><tr><th>BQ Table</th><th>Table ID</th><th>Max Month</th><th>Status</th></tr></thead>' +
        '<tbody>' + tableRows + '</tbody>' +
      '</table></div>' +
      controls +
      '<p class="pipe-link"><a href="' + _esc(d.trackerUrl || '#') + '" target="_blank" rel="noopener">Open tracker sheet &rarr;</a></p>';
    $$('.reveal', el).forEach(function(r) { r.classList.add('in'); });
  }

  function _fmtPeriod(yyyyMm) {
    if (!yyyyMm) return '—';
    var p = String(yyyyMm).split('-');
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return (months[parseInt(p[1], 10) - 1] || p[1]) + ' ' + p[0];
  }

  function _fmtTs(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleString('en-CA', {
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    } catch (e) { return iso; }
  }

  /* --- BR Queries pipeline controls -------------------------------------- */
  window._brMarkReminder = function(btn) {
    btn.disabled = true; btn.textContent = 'Saving…';
    google.script.run
      .withSuccessHandler(function() {
        btn.disabled = false; btn.textContent = 'Mark Reminder Sent';
        _pipeData = null; _loadPipeData(renderQueries);
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.textContent = 'Mark Reminder Sent';
        _epbToast('Error: ' + e.message);
      })
      .markReminderSent();
  };

  window._brMarkQueries = function(btn) {
    btn.disabled = true; btn.textContent = 'Saving…';
    google.script.run
      .withSuccessHandler(function() {
        btn.disabled = false; btn.textContent = 'Mark Queries Done';
        _pipeData = null; _loadPipeData(renderQueries);
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.textContent = 'Mark Queries Done';
        _epbToast('Error: ' + e.message);
      })
      .markQueriesWorkflowDone();
  };

  window._brRunCheck = function(btn) {
    btn.disabled = true; btn.textContent = 'Running…';
    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false; btn.textContent = 'Run Post-Run Check Now';
        if (res && res.error) { _epbToast('Check error: ' + res.error); return; }
        _epbToast('Post-run check complete — results updated.');
        _pipeData = null; _loadPipeData(renderQueries);
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.textContent = 'Run Post-Run Check Now';
        _epbToast('Error: ' + e.message);
      })
      .runPostRunCheckNow();
  };

  /* --- Admin tab ---------------------------------------------------------- */
  if (window.IS_ADMIN) {
    observeTab('view-admin', loadAdmin);
  }

  function loadAdmin() {
    var el = document.getElementById('admin-body');
    if (el) el.innerHTML = '<p class="pipe-loading">Loading access requests&hellip;</p>';
    google.script.run
      .withSuccessHandler(renderAdmin)
      .withFailureHandler(function (e) {
        _err('admin-body', 'Error loading access requests: ' + String(e));
      })
      .getPendingAccessRequests();
  }

  function _updateBulkBar() {
    var checked = document.querySelectorAll('.req-cb:checked');
    var bar = document.getElementById('bulk-bar');
    if (!bar) return;
    if (checked.length > 0) {
      document.getElementById('bulk-count').textContent = checked.length + ' selected';
      bar.style.display = '';
    } else {
      bar.style.display = 'none';
    }
    var selAll = document.getElementById('sel-all');
    if (selAll) {
      var all = document.querySelectorAll('.req-cb');
      selAll.checked = all.length > 0 && checked.length === all.length;
      selAll.indeterminate = checked.length > 0 && checked.length < all.length;
    }
  }

  function renderAdmin(result) {
    var el = document.getElementById('admin-body');
    if (!el) return;
    if (result.error) { el.innerHTML = '<p class="pipe-error">' + _esc(result.error) + '</p>'; return; }
    if (!result.requests || result.requests.length === 0) {
      el.innerHTML = '<p class="pipe-empty">No pending access requests.</p>';
      return;
    }
    // Store request data on elements directly to avoid HTML-entity round-trip issues
    var reqData = [];
    var rows = result.requests.map(function (r, idx) {
      var safe = JSON.stringify(r)
        .replace(/</g, '\\u003c').replace(/>/g, '\\u003e')
        .replace(/&/g, '\\u0026').replace(/'/g, '\\u0027')
        .replace(/"/g, '&quot;');
      reqData.push(r);
      return '<tr>' +
        '<td><input type="checkbox" class="req-cb" data-idx="' + idx + '"></td>' +
        '<td>' + _esc(r.email) + '</td>' +
        '<td>' + _esc(r.dashboard) + '</td>' +
        '<td>' + _esc(r.requestedAt || '') + '</td>' +
        '<td class="action-cell">' +
          '<button class="action-btn" onclick="window._epbApprove(' + safe + ')">Approve</button>' +
          '<button class="action-btn deny" data-row="' + r.rowIndex + '" data-email="' + _esc(r.email) + '" onclick="window._epbDeny(this)">Deny</button>' +
        '</td>' +
      '</tr>';
    }).join('');
    el.innerHTML =
      '<div id="bulk-bar" style="display:none; margin-bottom:8px;">' +
        '<span id="bulk-count"></span>&nbsp;' +
        '<button class="action-btn" id="bulk-approve-btn">Approve Selected</button>&nbsp;' +
        '<button class="action-btn deny" id="bulk-deny-btn">Deny Selected</button>' +
      '</div>' +
      '<div class="gt-wrap">' +
        '<table class="gt"><thead><tr>' +
          '<th><input type="checkbox" id="sel-all"></th>' +
          '<th>Email</th><th>Dashboard</th><th>Requested</th><th>Action</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>' +
      '</div>';

    document.getElementById('sel-all').addEventListener('change', function () {
      document.querySelectorAll('.req-cb').forEach(function (cb) { cb.checked = this.checked; }, this);
      _updateBulkBar();
    });
    document.querySelectorAll('.req-cb').forEach(function (cb) {
      cb.addEventListener('change', _updateBulkBar);
    });
    document.getElementById('bulk-approve-btn').addEventListener('click', function () {
      window._epbBulkApprove(reqData);
    });
    document.getElementById('bulk-deny-btn').addEventListener('click', function () {
      window._epbBulkDeny(reqData);
    });
  }

  /* --- Approve modal ------------------------------------------------------ */
  var _pending = null; // null | single-request object | array of request objects

  window._epbApprove = function (req) {
    _pending = req;
    document.getElementById('am-body').innerHTML =
      '<p>Grant <strong>' + _esc(req.email) + '</strong> access to <strong>' + _esc(req.dashboard) + '</strong>?</p>' +
      '<p class="modal-note">They will receive an email confirmation and can refresh EPB Hub immediately to access their dashboard.</p>';
    var btn = document.getElementById('am-submit');
    btn.disabled = false;
    btn.textContent = 'Approve';
    document.getElementById('approveModal').classList.add('open');
  };

  window._epbBulkApprove = function (allReqData) {
    var checked = document.querySelectorAll('.req-cb:checked');
    if (!checked.length) return;
    var reqs = [];
    checked.forEach(function (cb) {
      var idx = parseInt(cb.getAttribute('data-idx'), 10);
      if (allReqData[idx]) reqs.push(allReqData[idx]);
    });
    if (!reqs.length) return;
    _pending = reqs;
    var items = reqs.map(function (r) {
      return '<li>' + _esc(r.email) + ' &rarr; ' + _esc(r.dashboard) + '</li>';
    }).join('');
    var body = document.getElementById('am-body');
    var html =
      '<p>Approve the following <strong>' + reqs.length + '</strong> request' + (reqs.length > 1 ? 's' : '') + '?</p>' +
      '<ul style="margin:8px 0 8px 16px; padding:0; font-size:0.9em;">' + items + '</ul>' +
      '<p class="modal-note">Each user will receive an email confirmation.</p>';
    if (body) {
      body.innerHTML = html;
    } else {
      document.getElementById('am-email').textContent = reqs.length + ' request' + (reqs.length > 1 ? 's' : '');
      document.getElementById('am-dash').textContent = reqs.map(function(r) { return r.dashboard; }).join(', ');
    }
    var btn = document.getElementById('am-submit');
    btn.disabled = false;
    btn.textContent = 'Approve';
    document.getElementById('approveModal').classList.add('open');
  };

  window._epbCloseModal = function () {
    document.getElementById('approveModal').classList.remove('open');
    _pending = null;
  };

  window._epbSubmitApprove = function () {
    if (!_pending) return;
    var btn = document.getElementById('am-submit');
    btn.disabled = true;
    btn.textContent = 'Approving…';

    if (Array.isArray(_pending)) {
      var reqs = _pending;
      google.script.run
        .withSuccessHandler(function (res) {
          window._epbCloseModal();
          var failed = (res.results || []).filter(function (r) { return !r.success; });
          var ok     = (res.results || []).filter(function (r) { return r.success; });
          if (ok.length) _epbToast(ok.length + ' request' + (ok.length > 1 ? 's' : '') + ' approved.');
          if (failed.length) alert('Some approvals failed:\n' + failed.map(function (r) { return r.email + ': ' + r.error; }).join('\n'));
          loadAdmin();
        })
        .withFailureHandler(function (err) {
          window._epbCloseModal();
          alert('Bulk approval failed: ' + (err && err.message ? err.message : 'Check Apps Script logs.'));
        })
        .approveBulkAccessRequests(JSON.stringify(reqs));
      return;
    }

    var req = _pending;
    console.log('[Approve] sending to server:', { rowIndex: req.rowIndex, email: req.email, accessColumn: req.accessColumn });
    google.script.run
      .withSuccessHandler(function (res) {
        console.log('[Approve] server response:', JSON.stringify(res));
        window._epbCloseModal();
        if (res.success) {
          _epbToast(req.email + ' approved for ' + req.dashboard + '.');
          loadAdmin();
        } else {
          alert('Approval error: ' + (res.error || 'Unknown error'));
        }
      })
      .withFailureHandler(function (err) {
        console.error('[Approve] failure:', err);
        window._epbCloseModal();
        alert('Approval failed: ' + (err && err.message ? err.message : 'Check Apps Script logs.'));
      })
      .approveAccessRequest(req.rowIndex, req.email, req.accessColumn);
  };

  window._epbDeny = function (btn) {
    btn.disabled = true;
    btn.textContent = 'Denying…';
    var rowIndex = Number(btn.getAttribute('data-row'));
    var email    = btn.getAttribute('data-email');
    google.script.run
      .withSuccessHandler(function (res) {
        if (res.success) {
          _epbToast(email + ' denied.');
          loadAdmin();
        } else {
          btn.disabled = false;
          btn.textContent = 'Deny';
          _epbToast('Error: ' + (res.error || 'Unknown error'));
        }
      })
      .withFailureHandler(function () {
        btn.disabled = false;
        btn.textContent = 'Deny';
        _epbToast('Denial failed — check Apps Script logs.');
      })
      .denyAccessRequest(rowIndex);
  };

  window._epbBulkDeny = function (allReqData) {
    var checked = document.querySelectorAll('.req-cb:checked');
    if (!checked.length) return;
    var items = [];
    checked.forEach(function (cb) {
      var idx = parseInt(cb.getAttribute('data-idx'), 10);
      if (allReqData[idx]) { items.push(allReqData[idx]); cb.disabled = true; }
    });
    if (!items.length) return;
    var rowIndices = items.map(function (i) { return i.rowIndex; });
    google.script.run
      .withSuccessHandler(function (res) {
        var failed = (res.results || []).filter(function (r) { return !r.success; });
        var ok     = (res.results || []).filter(function (r) { return r.success; });
        if (ok.length) _epbToast(ok.length + ' request' + (ok.length > 1 ? 's' : '') + ' denied.');
        if (failed.length) _epbToast('Some denials failed — check Apps Script logs.');
        loadAdmin();
      })
      .withFailureHandler(function () {
        _epbToast('Bulk denial failed — check Apps Script logs.');
        loadAdmin();
      })
      .denyBulkAccessRequests(JSON.stringify(rowIndices));
  };

  window._epbOverlayClick = function (e) {
    if (e.target === document.getElementById('approveModal')) {
      window._epbCloseModal();
    }
  };

  /* --- Toast -------------------------------------------------------------- */
  function _epbToast(msg) {
    var t = document.getElementById('epbToast');
    if (!t) return;
    t.textContent = msg;
    t.classList.add('on');
    setTimeout(function () { t.classList.remove('on'); }, 3500);
  }

  window._epbToast = _epbToast;
})();


/* --- Roster manager filter ------------------------------------------------ */
(function () {
  'use strict';

  function initRosterFilter() {
    var mgrCards  = Array.prototype.slice.call(document.querySelectorAll('.team-card-mgr'));
    var teamCards = Array.prototype.slice.call(document.querySelectorAll('#team-grid .team-card'));
    var bar       = document.getElementById('roster-filter-bar');
    var label     = document.getElementById('roster-filter-label');
    var resetBtn  = document.getElementById('roster-filter-reset');
    var active    = null;

    if (!mgrCards.length) return;

    mgrCards.forEach(function (card) {
      card.addEventListener('click', function () {
        var key = card.getAttribute('data-filter');
        if (active === key) { reset(); return; }
        active = key;
        mgrCards.forEach(function (c) { c.classList.toggle('active', c === card); });
        teamCards.forEach(function (tc) {
          tc.classList.toggle('filtered-out', tc.getAttribute('data-mgr') !== key);
        });
        if (label) label.textContent = card.querySelector('.team-name').textContent;
        if (bar)   bar.hidden = false;
      });
    });

    if (resetBtn) resetBtn.addEventListener('click', reset);

    function reset() {
      active = null;
      mgrCards.forEach(function (c) { c.classList.remove('active'); });
      teamCards.forEach(function (tc) { tc.classList.remove('filtered-out'); });
      if (bar) bar.hidden = true;
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initRosterFilter);
  } else {
    initRosterFilter();
  }
})();

  'vancouver': [49.2827, -123.1207], 'vancouver bc': [49.2827, -123.1207],

  'waterloo': [42.7, -81.5], "nun's island": [45.0, -73.9],
  'bromont': [45.317, -72.650]
};

function _getCityCoords(turf) {
  if (!turf || turf === '?') return null;
  var key = turf.toLowerCase().trim()
    // strip accents (e.g. Montréal → montreal)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    // remove province suffix with or without comma: "Vancouver, BC" or "Vancouver BC"
    .replace(/[,\s]+(bc|ab|sk|mb|on|qc|nb|ns|pe|nl|nt|nu|yt)\b.*$/, '').trim()
    // remove full province names: "Waterloo, Ontario" → "waterloo"
    .replace(/[,\s]+(ontario|british columbia|alberta|saskatchewan|manitoba|quebec|new brunswick|nova scotia|prince edward island|newfoundland|northwest territories|nunavut|yukon)\b.*$/i, '').trim()
    // remove trailing "canada"
    .replace(/[,\s]+canada\s*$/, '').trim();
  return _CANADA_CITIES[key] || null;
}

function _getTeamKeys(card) {
  var filter = card.getAttribute('data-filter');
  var mgr    = card.getAttribute('data-mgr');
  if (filter) return [filter];
  if (mgr)    return [mgr];
  return ['leadership', 'direct'];
}

function _filterRosterMap(markerList, clickedCard, resetBtn) {
  var teamKeys = _getTeamKeys(clickedCard);
  markerList.forEach(function (item) {
    var inTeam = teamKeys.indexOf(item.teamKey) !== -1 || item.card === clickedCard;
    var el = item.marker.getElement();
    if (el) el.classList.toggle('roster-marker-dim', !inTeam);
  });
  resetBtn.style.display = 'block';
}

function _resetRosterMap(markerList, resetBtn) {
  markerList.forEach(function (item) {
    var el = item.marker.getElement();
    if (el) el.classList.remove('roster-marker-dim');
  });
  resetBtn.style.display = 'none';
}

function _getPinCoords(center, index, total) {
  if (total === 1) return center;
  // Arrange in a circle around the city; compensate lng scale at ~55N (cos 55° ≈ 0.57)
  var r = 0.5;
  var angle = (2 * Math.PI * index / total) - (Math.PI / 2);
  return [
    center[0] + r * Math.cos(angle),
    center[1] + r * Math.sin(angle) / 0.57
  ];
}

function initRosterMap() {
  if (_rosterMapInited || typeof L === 'undefined') return;
  _rosterMapInited = true;

  var _BC_BOUNDS   = [[47.5, -128.5], [55, -114.5]];
  var _EAST_BOUNDS = [[41.5, -86],    [48.5, -63]];
  var _TILE        = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
  var _TILE_OPT    = { attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors', maxZoom: 19 };
  var _MAP_OPT     = { zoomControl: false, scrollWheelZoom: false, doubleClickZoom: false, dragging: false, touchZoom: false, boxZoom: false, keyboard: false, tap: false };

  var mapBC   = L.map('roster-map-bc',   _MAP_OPT);
  var mapEast = L.map('roster-map-east', _MAP_OPT);
  L.tileLayer(_TILE, _TILE_OPT).addTo(mapBC);
  L.tileLayer(_TILE, _TILE_OPT).addTo(mapEast);

  // Re-fit after two animation frames so Leaflet measures the real
  // container dimensions (tabview was display:none during page load)
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      mapBC.invalidateSize();   mapBC.fitBounds(_BC_BOUNDS);
      mapEast.invalidateSize(); mapEast.fitBounds(_EAST_BOUNDS);
    });
  });

  var resetBtn = document.getElementById('roster-map-reset');
  var markerList = [];

  // Group cards by city so same-city duplicates can be spread out
  var cityGroups = {};
  document.querySelectorAll('#team-cards-data .team-card').forEach(function (card) {
    var stats = {};
    try { stats = JSON.parse(card.getAttribute('data-card') || '{}'); } catch (e) {}
    var coords = _getCityCoords(stats.turf);
    if (!coords) return;
    var key = coords[0].toFixed(2) + ',' + coords[1].toFixed(2);
    if (!cityGroups[key]) cityGroups[key] = { center: coords, members: [] };
    cityGroups[key].members.push({
      card:    card,
      initials: card.querySelector('.team-init').textContent.trim(),
      name:    card.querySelector('.team-name').textContent.trim(),
      teamKey: card.getAttribute('data-filter') || card.getAttribute('data-mgr') || 'leadership'
    });
  });

  Object.keys(cityGroups).forEach(function (key) {
    var group  = cityGroups[key];
    var total  = group.members.length;
    var m      = group.center[1] < -100 ? mapBC : mapEast;

    group.members.forEach(function (member, i) {
      var pinCoords = _getPinCoords(group.center, i, total);

      if (total > 1) {
        L.polyline([pinCoords, group.center], {
          color: '#4B286D', weight: 1.5, opacity: 0.4, dashArray: '5 5'
        }).addTo(m);
        if (i === 0) {
          L.circleMarker(group.center, {
            radius: 4, color: '#4B286D', fillColor: '#4B286D',
            fillOpacity: 0.35, weight: 1.5, opacity: 0.5, interactive: false
          }).addTo(m);
        }
      }

      var marker = L.marker(pinCoords, {
        icon: L.divIcon({
          className: 'roster-pin',
          html: '<div class="pin-dot" title="' + member.name + '">' + member.initials + '</div>',
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        }),
        title: member.name
      });

      marker.on('click', function () {
        _filterRosterMap(markerList, member.card, resetBtn);
        window.openRosterModal(member.card);
      });

      marker.addTo(m);
      markerList.push({ marker: marker, card: member.card, teamKey: member.teamKey });
    });
  });

  if (resetBtn) {
    resetBtn.addEventListener('click', function () { _resetRosterMap(markerList, resetBtn); });
  }
}

/* --- Engagement tabs -------------------------------------------------------- */
(function () {
  'use strict';

  // ── helpers ────────────────────────────────────────────────────────────────

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmt(n) { return n == null ? '—' : Number(n).toFixed(1); }
  function fmtPct(n) { return n == null ? '—' : Number(n).toFixed(0) + '%'; }

  function trendArrow(delta) {
    if (delta == null) return '<span class="eng-arrow eng-arrow--flat">—</span>';
    if (delta >= 0.1)  return '<span class="eng-arrow eng-arrow--up">&#9650;</span>';
    if (delta <= -0.1) return '<span class="eng-arrow eng-arrow--dn">&#9660;</span>';
    return '<span class="eng-arrow eng-arrow--flat">&#9644;</span>';
  }

  function scoreClass(n) {
    if (n == null) return 'pend';
    if (n >= 8.5)  return 'ok';
    if (n >= 7.5)  return 'warn';
    if (n >= 6.5)  return 'pend';
    return 'fail';
  }

  function scoreLabel(n) {
    if (n == null) return '';
    if (n >= 8.5) return 'Outstanding';
    if (n >= 7.5) return 'Solid';
    if (n >= 6.5) return 'Room to grow';
    return 'Needs attention';
  }

  function trendWord(delta) {
    if (delta == null) return 'holding steady';
    if (delta >= 0.3)  return 'climbing 📈';
    if (delta <= -0.3) return 'slipping 📉';
    return 'holding steady';
  }

  // Group rows by YYYY-MM, keep last row of each month
  function aggregateByMonth(rows) {
    var buckets = {};
    rows.forEach(function (r) {
      var key = String(r.date).slice(0, 7);
      if (!buckets[key]) buckets[key] = [];
      buckets[key].push(r);
    });

    function mean(arr, field) {
      var vals = arr.map(function (r) { return r[field]; })
                    .filter(function (v) { return v != null && !isNaN(v); });
      if (!vals.length) return null;
      return Math.round((vals.reduce(function (a, b) { return a + b; }, 0) / vals.length) * 10) / 10;
    }

    function meanSub(arr, subKey) {
      var vals = arr.map(function (r) { return r.sub ? r.sub[subKey] : null; })
                    .filter(function (v) { return v != null && !isNaN(v); });
      if (!vals.length) return null;
      return Math.round((vals.reduce(function (a, b) { return a + b; }, 0) / vals.length) * 10) / 10;
    }

    var SUB_KEYS = [
      'recogQuality','recogFrequency','championing','pride',
      'feedbackQuality','feedbackFreq','feedbackSuggest',
      'peerCollab','peerTrust','peerComm',
      'mgrCollab','mgrTrust','mgrComm',
      'satisFair','satisRole','satisEnv',
      'alignValues','alignVision','alignEthics',
      'happyWork','happyWLB','stress','personalHealth',
      'autonomy','mastery','purpose'
    ];

    return Object.keys(buckets).sort().map(function (k) {
      var monthRows = buckets[k];
      var sub = {};
      SUB_KEYS.forEach(function (sk) { sub[sk] = meanSub(monthRows, sk); });
      return {
        date:           monthRows[monthRows.length - 1].date,
        _count:         monthRows.length,
        engagement:       mean(monthRows, 'engagement'),
        participation:    mean(monthRows, 'participation'),
        participantCount: mean(monthRows, 'participantCount'),
        eNPS:             mean(monthRows, 'eNPS'),
        recognition:    mean(monthRows, 'recognition'),
        ambassadorship: mean(monthRows, 'ambassadorship'),
        feedback:       mean(monthRows, 'feedback'),
        relPeers:       mean(monthRows, 'relPeers'),
        relManager:     mean(monthRows, 'relManager'),
        satisfaction:   mean(monthRows, 'satisfaction'),
        alignment:      mean(monthRows, 'alignment'),
        happiness:      mean(monthRows, 'happiness'),
        wellness:       mean(monthRows, 'wellness'),
        personalGrowth: mean(monthRows, 'personalGrowth'),
        expSatis:       mean(monthRows, 'expSatis'),
        orgCulture:     mean(monthRows, 'orgCulture'),
        growthWell:     mean(monthRows, 'growthWell'),
        sub:            sub
      };
    });
  }

  function monthLabel(dateStr) {
    var d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-CA', { month: 'long', year: 'numeric' });
  }

  function delta(cur, prev, key) {
    if (!prev || cur[key] == null || prev[key] == null) return null;
    return Math.round((cur[key] - prev[key]) * 10) / 10;
  }

  // ── shared data cache ──────────────────────────────────────────────────────

  var _engData    = null;
  var _engLoading = false;
  var _engCbs     = [];

  function _loadEngData(cb) {
    if (_engData) { cb(_engData); return; }
    _engCbs.push(cb);
    if (_engLoading) return;
    _engLoading = true;
    google.script.run
      .withSuccessHandler(function (d) {
        _engData    = d;
        _engLoading = false;
        var cbs = _engCbs.slice(); _engCbs = [];
        cbs.forEach(function (fn) { fn(d); });
      })
      .withFailureHandler(function (e) {
        _engLoading = false;
        var msg = 'Error loading engagement data: ' + String(e);
        var cbs = _engCbs.slice(); _engCbs = [];
        cbs.forEach(function () {
          ['eng-dashboard-body','eng-trends-body','eng-reports-body','eng-archive-body'].forEach(function (id) {
            var el = document.getElementById(id);
            if (el && el.innerHTML.indexOf('Loading') > -1)
              el.innerHTML = '<p class="pipe-error">' + esc(msg) + '</p>';
          });
        });
      })
      .getEngagementData();
  }

  // ── tab observers ──────────────────────────────────────────────────────────

  function observeTab(id, fn) {
    var el = document.getElementById(id);
    if (!el) return;
    var done = false;
    new MutationObserver(function () {
      if (!el.hidden && !done) { done = true; fn(); }
    }).observe(el, { attributes: true, attributeFilter: ['hidden'] });
  }

  observeTab('view-eng-dashboard', function () { _loadEngData(renderEngDashboard); });
  observeTab('view-eng-trends',    function () { _loadEngData(renderEngTrends); });
  observeTab('view-eng-reports',   function () { _loadEngData(renderEngReports); });
  observeTab('view-eng-archive',   function () { _loadEngData(renderEngArchive); });

  // ── Arc gauge core (270° speedometer, circle stroke-dashoffset) ──────────────
  //
  // opts: { min, max, unit, decimals, showPlus, good, ok, subtext, lblLeft, lblRight }
  //   min/max   – scale bounds  (default 0/10)
  //   unit      – suffix on displayed value  (default '')
  //   decimals  – decimal places for value   (default 1)
  //   showPlus  – prepend '+' for positive values  (default false)
  //   good/ok   – colour thresholds: ≥good=green, ≥ok=amber, else red
  //   subtext   – optional second line inside the dial (e.g. respondent count)
  //   lblLeft   – scale label at the min (lower-left) end
  //   lblRight  – scale label at the max (lower-right) end

  function _arcGauge(value, prevValue, opts) {
    var min      = opts.min      != null ? opts.min      : 0;
    var max      = opts.max      != null ? opts.max      : 10;
    var unit     = opts.unit     != null ? opts.unit     : '';
    var decimals = opts.decimals != null ? opts.decimals : 1;
    var showPlus = !!opts.showPlus;
    var good     = opts.good     != null ? opts.good     : 7.5;
    var ok       = opts.ok       != null ? opts.ok       : 6.0;
    var subtext  = opts.subtext  || null;
    var lblLeft  = opts.lblLeft  != null ? String(opts.lblLeft)  : String(min);
    var lblRight = opts.lblRight != null ? String(opts.lblRight) : String(max);

    var r = 44, cx = 60, cy = 60, sw = 11;
    var C   = +(2 * Math.PI * r).toFixed(3);  // ≈ 276.460
    var arc = +(C * 0.75).toFixed(3);          // 270° arc ≈ 207.345
    var gap = +(C - arc).toFixed(3);

    var mom = (value != null && prevValue != null)
      ? Math.round((value - prevValue) * 10) / 10 : null;
    var momClr = mom == null ? '#888' : mom > 0 ? '#2f9e44' : mom < 0 ? '#c92a2a' : '#888';
    var momTxt = mom != null
      ? (mom > 0 ? '▲ +' : mom < 0 ? '▼ ' : '→ ') + Math.abs(mom).toFixed(decimals) : '';

    var fillClr = value == null ? '#bbb'
      : value >= good ? '#2f9e44'
      : value >= ok   ? '#e67700'
      : '#c92a2a';

    var frac = value != null
      ? Math.max(0, Math.min(1, (value - min) / (max - min))) : 0;
    var fillTarget = value != null ? +(arc * (1 - frac)).toFixed(3) : arc;

    // SVG-CW angle for a value on [min,max] — 0° at min (7 o'clock), 270° at max (5 o'clock)
    function thetaRad(v) {
      return (135 + ((v - min) / (max - min)) * 270) * Math.PI / 180;
    }
    function pt(v, rad) {
      var t = thetaRad(v);
      return { x: +(cx + rad * Math.cos(t)).toFixed(2), y: +(cy + rad * Math.sin(t)).toFixed(2) };
    }

    // 5 evenly-spaced tick marks; major at 0%, 50%, 100% of scale
    var tickHTML = [0, 0.25, 0.5, 0.75, 1].map(function (f, i) {
      var v = min + f * (max - min);
      var major = (i === 0 || i === 2 || i === 4);
      var p1 = pt(v, 48), p2 = pt(v, major ? 56 : 52);
      return '<line x1="' + p1.x + '" y1="' + p1.y +
             '" x2="' + p2.x + '" y2="' + p2.y +
             '" stroke="' + (major ? '#b0a0cc' : '#cfc5e4') +
             '" stroke-width="' + (major ? 2 : 1.2) + '" stroke-linecap="round"/>';
    }).join('');

    // Labels only at min (lower-left) and max (lower-right) — skip midpoint to avoid SVG clipping
    var pL = pt(min, 64), pR = pt(max, 64);
    var lblHTML =
      '<text x="' + pL.x + '" y="' + pL.y + '" text-anchor="end"   font-size="7.5" fill="#a090be">' + lblLeft  + '</text>' +
      '<text x="' + pR.x + '" y="' + pR.y + '" text-anchor="start" font-size="7.5" fill="#a090be">' + lblRight + '</text>';

    // Centre lines: value, optional subtext, optional MoM
    var hasSubtext = !!(subtext && value != null);
    var hasMoM     = !!momTxt;
    var lineCount  = 1 + (hasSubtext ? 1 : 0) + (hasMoM ? 1 : 0);
    var lineSpacing = 14;
    var yTop = 60 - ((lineCount - 1) / 2) * lineSpacing;

    var valStr = value != null
      ? (showPlus && value > 0 ? '+' : '') + value.toFixed(decimals) + unit : '—';

    return '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" class="eng-gauge-svg"' +
      ' data-fill-target="' + fillTarget + '">' +
      '<g transform="rotate(135 60 60)">' +
        '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="#ece6f6" stroke-width="' + sw + '"' +
          ' stroke-dasharray="' + arc + ' ' + gap + '" stroke-linecap="round"/>' +
        '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="' + fillClr + '"' +
          ' stroke-width="' + sw + '" stroke-dasharray="' + arc + ' ' + gap + '"' +
          ' stroke-dashoffset="' + arc + '" stroke-linecap="round" class="eng-gauge-fill"' +
          ' style="filter:drop-shadow(0 0 4px ' + fillClr + 'aa)"/>' +
      '</g>' +
      tickHTML + lblHTML +
      // Score
      '<text x="60" y="' + yTop + '" text-anchor="middle" dominant-baseline="middle"' +
        ' font-family="Helvetica Neue,Arial,sans-serif" font-size="20" font-weight="700"' +
        ' fill="' + fillClr + '">' + valStr + '</text>' +
      // Subtext
      (hasSubtext
        ? '<text x="60" y="' + (yTop + lineSpacing) + '" text-anchor="middle" dominant-baseline="middle"' +
          ' font-family="Helvetica Neue,Arial,sans-serif" font-size="8.5" fill="#777">' + subtext + '</text>'
        : '') +
      // MoM trend
      (hasMoM
        ? '<text x="60" y="' + (yTop + lineSpacing * (hasSubtext ? 2 : 1)) + '"' +
          ' text-anchor="middle" dominant-baseline="middle"' +
          ' font-family="Helvetica Neue,Arial,sans-serif" font-size="9" font-weight="600"' +
          ' fill="' + momClr + '">' + momTxt + '</text>'
        : '') +
      '</svg>';
  }

  // Wrappers for the three gauge types

  function makeGaugeSVG(score, prevScore) {
    return _arcGauge(score, prevScore, {
      min: 0, max: 10, unit: '', decimals: 1, good: 7.5, ok: 6.0,
      lblLeft: '0', lblRight: '10'
    });
  }

  function makeParticipationGaugeSVG(pct, prevPct, count) {
    return _arcGauge(pct, prevPct, {
      min: 0, max: 100, unit: '%', decimals: 0, good: 80, ok: 60,
      lblLeft: '0%', lblRight: '100%',
      subtext: count != null ? Math.round(count) + ' respondents' : null
    });
  }

  function makeENPSGaugeSVG(enps, prevEnps) {
    return _arcGauge(enps, prevEnps, {
      min: -100, max: 100, unit: '', decimals: 0, showPlus: true, good: 30, ok: 0,
      lblLeft: '-100', lblRight: '+100'
    });
  }

  // ── Dashboard ──────────────────────────────────────────────────────────────

  function renderEngDashboard(rows) {
    var el = document.getElementById('eng-dashboard-body');
    if (!el) return;
    if (!rows || !rows.length) { el.innerHTML = '<p class="pipe-empty">No engagement data found.</p>'; return; }

    var monthly = aggregateByMonth(rows);
    var cur  = monthly[monthly.length - 1];
    var prev = monthly.length > 1 ? monthly[monthly.length - 2] : null;

    var partPct   = cur.participation;
    var partCount = cur.participantCount;
    var eNPSVal   = cur.eNPS;

    var partAlert = '';
    if (partPct !== null && partPct < 70) {
      partAlert = '<div class="gnote reveal" style="margin-top:1rem">' +
        '<span class="dsr-icon" aria-hidden="true">!</span>' +
        '<div><h4 class="gnote-h">Low participation this period</h4>' +
        '<p class="gnote-p">Only ' + fmtPct(partPct) + ' of the team responded — scores may not be fully representative.</p></div></div>';
    }

    var eNPSStr = eNPSVal != null ? (eNPSVal > 0 ? '+' : '') + eNPSVal.toFixed(0) : '—';

    var header = '<div class="gstats reveal" style="margin-bottom:1.25rem">' +
      '<div class="gstat"><b>' + esc(monthLabel(cur.date)) + '</b><span>Period (' + (cur._count || 1) + '-entry avg)</span></div>' +
      '<div class="gstat"><b>' + fmtPct(partPct) + '</b><span>Participation</span></div>' +
      '<div class="gstat"><b>' + eNPSStr + '</b><span>eNPS</span></div>' +
    '</div>';

    var gauges =
      '<div class="eng-gauge-layout reveal">' +
        '<div class="eng-gauge-row">' +
          '<div class="eng-gauge-card">' +
            makeGaugeSVG(cur.engagement, prev ? prev.engagement : null) +
            '<div class="eng-gauge-label">Overall Engagement</div>' +
          '</div>' +
          '<button class="eng-gauge-btn" data-cat="expSatis">' +
            makeGaugeSVG(cur.expSatis, prev ? prev.expSatis : null) +
            '<div class="eng-gauge-label">Experience &amp; Satisfaction</div>' +
            '<div class="eng-gauge-hint">tap for details</div>' +
          '</button>' +
          '<button class="eng-gauge-btn" data-cat="orgCulture">' +
            makeGaugeSVG(cur.orgCulture, prev ? prev.orgCulture : null) +
            '<div class="eng-gauge-label">Culture &amp; Relationships</div>' +
            '<div class="eng-gauge-hint">tap for details</div>' +
          '</button>' +
          '<button class="eng-gauge-btn" data-cat="growthWell">' +
            makeGaugeSVG(cur.growthWell, prev ? prev.growthWell : null) +
            '<div class="eng-gauge-label">Growth, Alignment &amp; Wellbeing</div>' +
            '<div class="eng-gauge-hint">tap for details</div>' +
          '</button>' +
        '</div>' +
      '</div>';

    el.innerHTML = header + gauges + partAlert + _engHighlights(cur, prev);
    $$('.reveal', el).forEach(function(r) { r.classList.add('in'); });

    // Trigger fill animations after paint (CSS transition fires when dashoffset changes)
    requestAnimationFrame(function () {
      el.querySelectorAll('.eng-gauge-svg').forEach(function (svg) {
        var fill = svg.querySelector('.eng-gauge-fill');
        if (fill) fill.style.strokeDashoffset = svg.getAttribute('data-fill-target');
      });
    });

    el.querySelectorAll('.eng-gauge-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { _openEngModal(btn.getAttribute('data-cat'), cur, prev); });
    });
  }

  // ── Gauge highlights ───────────────────────────────────────────────────────

  function _engHighlights(cur, prev) {
    var items = [];

    var dEng = delta(cur, prev, 'engagement');
    if (dEng != null) {
      var dir  = dEng >= 0.1 ? 'up' : dEng <= -0.1 ? 'down' : 'steady';
      var desc = dEng >= 0.3 ? 'Nice step forward! 📈' : dEng <= -0.3 ? 'Worth a closer look. 📉' : 'Holding steady — consistency counts!';
      items.push(dir === 'steady'
        ? 'Overall engagement is <strong>' + fmt(cur.engagement) + '</strong> — ' + desc
        : 'Engagement ' + dir + ' to <strong>' + fmt(cur.engagement) + '</strong> (' + (dEng >= 0 ? '+' : '') + dEng.toFixed(1) + ') — ' + desc);
    } else {
      items.push('Overall engagement: <strong>' + fmt(cur.engagement) + '</strong>.');
    }

    var part = cur.participation, dPart = delta(cur, prev, 'participation');
    if (part != null) {
      var pd = dPart != null && Math.abs(dPart) >= 5 ? ' (' + (dPart > 0 ? '+' : '') + dPart.toFixed(0) + '%)' : '';
      var pdesc = part >= 90 ? 'Full house — every voice counted!' :
                  part >= 75 ? 'Strong turnout.' :
                  part >= 60 ? 'Moderate — some voices may be missing.' :
                  'Low turnout — take scores with some context.';
      items.push('Participation: <strong>' + fmtPct(part) + '</strong>' + pd + '. ' + pdesc);
    }

    var ranked = [
      { label: 'Recognition',     val: cur.recognition },
      { label: 'Ambassadorship',  val: cur.ambassadorship },
      { label: 'Feedback',        val: cur.feedback },
      { label: 'Rel. with Peers', val: cur.relPeers },
      { label: 'Rel. with Mgr',   val: cur.relManager },
      { label: 'Satisfaction',    val: cur.satisfaction },
      { label: 'Alignment',       val: cur.alignment },
      { label: 'Happiness',       val: cur.happiness },
      { label: 'Wellness',        val: cur.wellness },
      { label: 'Personal Growth', val: cur.personalGrowth }
    ].filter(function (m) { return m.val != null; })
     .sort(function (a, b) { return b.val - a.val; });

    if (ranked.length) {
      var top = ranked[0];
      items.push('<strong>' + esc(top.label) + '</strong> leads at <strong>' + fmt(top.val) + '</strong> — ' + scoreLabel(top.val) + '! 🌟');
      var low = ranked[ranked.length - 1];
      if (low !== top && low.val < 7.5)
        items.push('<strong>' + esc(low.label) + '</strong> at <strong>' + fmt(low.val) + '</strong> — ' + scoreLabel(low.val) + '. Worth keeping an eye on.');
    }

    var eNPS = cur.eNPS;
    if (eNPS != null) {
      var eStr  = (eNPS > 0 ? '+' : '') + eNPS.toFixed(0);
      var edesc = eNPS >= 50 ? 'excellent — the team are real advocates.' :
                  eNPS >= 20 ? 'healthy — more promoters than detractors.' :
                  eNPS >= 0  ? 'neutral — room to build more advocates.' :
                  'more detractors than promoters. Worth a deeper listen.';
      items.push('eNPS is <strong>' + eStr + '</strong> — ' + edesc);
    }

    return '<div class="eng-highlights reveal">' +
      '<h3 class="eng-highlights-h">Team Pulse &mdash; ' + esc(monthLabel(cur.date)) + ' Highlights</h3>' +
      '<ul class="eng-highlights-list">' + items.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul>' +
    '</div>';
  }

  function _ensureEngModal() {
    if (document.getElementById('eng-detail-modal')) return;
    var m = document.createElement('div');
    m.className = 'modal-overlay';
    m.id = 'eng-detail-modal';
    m.addEventListener('click', function (e) { if (e.target === m) window._closeEngModal(); });
    m.innerHTML =
      '<div class="modal-box" style="max-width:480px;padding:1.5rem;position:relative">' +
        '<button onclick="window._closeEngModal()" aria-label="Close" ' +
          'style="position:absolute;top:.75rem;right:.75rem;background:none;border:none;font-size:1.5rem;cursor:pointer;color:#666;line-height:1">&times;</button>' +
        '<div id="eng-modal-body"></div>' +
      '</div>';
    document.body.appendChild(m);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') window._closeEngModal(); });
  }

  window._closeEngModal = function () {
    var m = document.getElementById('eng-detail-modal');
    if (m) m.classList.remove('open');
  };

  function _openEngModal(cat, cur, prev) {
    _ensureEngModal();
    var cfg = _ENG_CATS[cat];
    if (!cfg || !cur) return;

    var cs = cur[cfg.key], ps = prev ? prev[cfg.key] : null;
    var d  = cs != null && ps != null ? Math.round((cs - ps) * 10) / 10 : null;
    var momClr = d == null ? '#888' : d > 0 ? '#66CC00' : d < 0 ? '#cc3300' : '#888';
    var momStr = d != null ? (d >= 0 ? '+' : '') + d.toFixed(1) + ' vs prev month' : '';

    var metricsHTML = cfg.metrics.map(function (m) {
      var ms = cur[m.key], mp = prev ? prev[m.key] : null;
      var md = ms != null && mp != null ? Math.round((ms - mp) * 10) / 10 : null;
      var subHTML = m.subs.map(function (s) {
        var ss = cur.sub ? cur.sub[s.k] : null;
        var sp = prev && prev.sub ? prev.sub[s.k] : null;
        var sd = ss != null && sp != null ? Math.round((ss - sp) * 10) / 10 : null;
        return '<div class="eng-sub-row">' +
          '<span class="eng-sub-label">' + esc(s.l) + '</span>' +
          '<span class="eng-sub-score">' + fmt(ss) + '</span>' +
          '<span class="eng-sub-arrow">' + trendArrow(sd) + '</span>' +
        '</div>';
      }).join('');
      return '<div class="eng-modal-metric">' +
        '<div class="eng-modal-hd">' +
          '<span class="eng-modal-mname">' + esc(m.label) + '</span>' +
          '<span class="pbadge ' + scoreClass(ms) + '">' + fmt(ms) + '</span>' +
          '<span class="eng-modal-trend">' + trendArrow(md) + (md != null ? ' ' + (md >= 0 ? '+' : '') + md.toFixed(1) : '') + '</span>' +
        '</div>' +
        '<div class="eng-sub-rows">' + subHTML + '</div>' +
      '</div>';
    }).join('');

    document.getElementById('eng-modal-body').innerHTML =
      '<h3 style="margin:0 0 .2rem;color:#4B286D;padding-right:2rem">' + cfg.title + '</h3>' +
      '<p style="margin:0 0 1rem">' +
        '<span style="font-size:1.6rem;font-weight:bold">' + fmt(cs) + '</span>' +
        (momStr ? '<span style="margin-left:.6rem;font-size:.85rem;color:' + momClr + '">' + momStr + '</span>' : '') +
      '</p>' +
      '<hr style="border:none;border-top:1px solid #e5e0ee;margin-bottom:1rem">' +
      metricsHTML;

    document.getElementById('eng-detail-modal').classList.add('open');
  }

  // ── Trends (Chart.js) ──────────────────────────────────────────────────────

  var _engCharts = {};

  function renderEngTrends(rows) {

    if (!el) return;

      el.innerHTML = '<p class="pipe-empty">No engagement data found.</p>';

    el.innerHTML =
      '<div class="eng-chart-group reveal"><h3 class="eng-chart-h">Composite Scores</h3>' +
      '<canvas id="eng-chart-composite"></canvas></div>' +
      '<div class="eng-chart-group reveal"><h3 class="eng-chart-h">Core Metrics</h3>' +
      '<canvas id="eng-chart-core"></canvas></div>' +
      '<div class="eng-chart-group reveal"><h3 class="eng-chart-h">Participation &amp; eNPS</h3>' +

    var chartDefaults = {

        }
      }
