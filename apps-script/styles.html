<style>
/* ===========================================================================
   EPB TEAM SITE - stylesheet
   Based on Basic Microsite UI reference kit. Tokens in :root drive everything.
   =========================================================================== */

/* ---------------------------------------------------------------- 1. TOKENS */
:root{
  --purple:#4B286D;
  --purple-d:#38205A;
  --purple-l:#63398B;
  --ink:#2A1A3E;
  --green:#66CC00;
  --lime:#8FDD3D;
  --tint:#F6F2FA;
  --tint2:#F0EAF7;
  --line:#E8E6EC;
  --line-d:#D8D5DE;
  --grey:#54505C;
  --grey-l:#918A9C;
  --disp:"Helvetica Neue",Arial,sans-serif;
  --text:"Helvetica Neue",Arial,sans-serif;
  --micro:"Helvetica Neue",Arial,sans-serif;
  --gut:clamp(20px,5vw,72px);
  --navh:72px;
}

*{box-sizing:border-box}
body{margin:0;font-family:var(--text);font-size:16px;line-height:1.55;
  color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:var(--purple)}
[hidden]{display:none!important}

/* ------------------------------------------------------------ 2. TYPE SCALE */
.h2{font-family:var(--disp);font-weight:900;font-size:clamp(31px,4.8vw,64px);
  line-height:1.04;letter-spacing:-.028em;color:var(--ink)}
.h3{font-family:var(--disp);font-weight:750;font-size:clamp(23px,2.7vw,37px);
  line-height:1.1;letter-spacing:-.024em;color:var(--ink);text-wrap:balance}
.eyebrow{font-family:var(--micro);font-size:11px;font-weight:500;
  letter-spacing:.18em;text-transform:uppercase;color:var(--grey-l)}
.lede{font-family:var(--text);font-size:clamp(16px,1.5vw,19px);line-height:1.55;
  color:var(--grey);max-width:74ch}

/* --------------------------------------------------------------- 3. GREETER */
.gr-panel{min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;position:relative}
.gr-one{gap:clamp(12px,2vw,24px);
  padding:clamp(20px,4.5vh,60px) 0 clamp(18px,3.5vh,46px)}
.gr-logo{height:clamp(30px,3.4vw,44px);width:auto;
  margin:0 auto clamp(-12px,-.9vw,-6px);position:relative;z-index:1;
  display:grid;place-items:center;padding:0 18px;border-radius:8px;
  background:var(--tint2);color:var(--purple);
  font-family:var(--micro);font-size:11px;font-weight:700;letter-spacing:.14em;
  animation:up .9s cubic-bezier(.2,0,0,1) both}
.gr-word{font-family:var(--disp);font-weight:900;
  font-size:clamp(72px,18vw,240px);line-height:.84;letter-spacing:-.05em;
  color:var(--ink);text-align:center;margin:0;
  animation:up .9s cubic-bezier(.2,0,0,1) both}
.gr-word-svg{width:clamp(280px,72vw,860px);height:auto;display:block;
  margin:0 auto;animation:up .9s cubic-bezier(.2,0,0,1) both}
.gr-place{font-family:var(--micro);font-size:clamp(11.5px,1.15vw,14px);
  font-weight:500;letter-spacing:.19em;text-transform:uppercase;
  color:var(--grey);text-align:center;padding:0 var(--gut);margin:0;
  animation:up .9s cubic-bezier(.2,0,0,1) .08s both}
.gr-ask{font-family:var(--disp);font-weight:750;
  font-size:clamp(20px,2.8vw,36px);line-height:1.06;letter-spacing:-.028em;
  color:var(--grey);text-align:center;text-wrap:balance;padding:0 var(--gut);
  margin:0;animation:up .9s cubic-bezier(.2,0,0,1) .12s both}
.gr-chev{margin-top:clamp(4px,1.2vw,14px);width:52px;height:52px;
  border-radius:50%;border:1px solid var(--line-d);background:#fff;
  color:var(--purple);cursor:pointer;display:grid;place-items:center;
  transition:background .2s,color .2s,border-color .2s,transform .2s;
  animation:up .9s cubic-bezier(.2,0,0,1) .18s both}
.gr-chev svg{width:24px;height:24px}
.gr-chev:hover{background:var(--purple);border-color:var(--purple);color:#fff;
  transform:translateY(2px)}

/* Panel 2 */
.gr-two{background:var(--ink);text-align:center;padding:0 var(--gut);overflow:hidden}
.gr-kicker{font-family:var(--disp);font-weight:900;
  font-size:clamp(26px,3.4vw,44px);line-height:1.06;letter-spacing:-.028em;
  color:#fff;margin:0 0 12px}
.gr-lede{font-family:var(--text);font-size:clamp(14px,1.2vw,17px);
  line-height:1.55;color:rgba(255,255,255,.72);max-width:62ch;
  margin:0 auto clamp(28px,3.4vw,52px)}

/* --------------------------------------------------------- 4. SECTION CARDS */
.ws-cards{display:grid;grid-template-columns:repeat(5,1fr);
  gap:clamp(12px,1.4vw,20px);width:100%;max-width:1500px;margin:0 auto}
.ws-card{display:flex;flex-direction:column;align-items:center;text-align:center;
  cursor:pointer;padding:clamp(24px,2.4vw,34px) clamp(14px,1.4vw,22px);
  border-radius:16px;position:relative;overflow:hidden;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);
  transition:transform .3s cubic-bezier(.2,0,0,1),border-color .3s,
             background .3s,box-shadow .3s}
.ws-card::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:var(--green);transform:scaleX(0);transform-origin:left;
  transition:transform .3s cubic-bezier(.2,0,0,1)}
.ws-card:hover{transform:translateY(-8px);border-color:rgba(255,255,255,.42);
  background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.10));
  box-shadow:0 22px 52px rgba(0,0,0,.30)}
.ws-card:hover::after{transform:scaleX(1)}
.ws-card:focus-visible{outline:3px solid var(--lime);outline-offset:4px}
.ws-num{position:relative;font-family:var(--micro);font-size:10px;
  font-weight:500;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(255,255,255,.62);
  padding-bottom:clamp(14px,1.6vw,20px);margin-bottom:clamp(14px,1.6vw,20px)}
.ws-num::after{content:"";position:absolute;left:50%;bottom:0;
  transform:translateX(-50%);width:26px;height:2px;border-radius:2px;
  background:rgba(255,255,255,.30);transition:width .26s,background .26s}
.ws-card:hover .ws-num::after{width:44px;background:var(--green)}
.ws-title{font-family:var(--disp);font-weight:900;
  font-size:clamp(15px,1.35vw,19px);line-height:1.16;letter-spacing:-.018em;
  color:#fff;margin-bottom:9px;text-wrap:balance}
.ws-blurb{font-family:var(--text);font-size:clamp(11.5px,.92vw,13px);
  line-height:1.45;color:rgba(255,255,255,.70);flex:1}
.ws-go{margin-top:clamp(14px,1.6vw,20px);font-family:var(--text);
  font-size:12.5px;font-weight:700;color:var(--lime);display:inline-flex;
  align-items:center;gap:7px;opacity:.85;transition:opacity .26s}
.ws-go i{font-style:normal;transition:transform .26s}
.ws-card:hover .ws-go{opacity:1}
.ws-card:hover .ws-go i{transform:translateX(4px)}
@media(max-width:1180px){.ws-cards{grid-template-columns:repeat(3,1fr)}}
@media(max-width:760px){
  .ws-cards{grid-template-columns:1fr;gap:12px}
  .ws-card{flex-direction:column;align-items:flex-start;text-align:left;
    padding:20px 22px;border-radius:14px}
  .ws-card .ws-num{position:absolute;top:10px;right:16px;margin:0;padding:0}
  .ws-card .ws-num::after{display:none}
  .ws-title{margin-bottom:4px;padding-right:96px}
  .ws-go{display:none}
}

/* ------------------------------------------------------- 5. STICKY TAB BAR */
.nav{position:fixed;top:0;left:0;right:0;z-index:60;background:transparent;
  border-bottom:1px solid rgba(255,255,255,.16);
  transition:background .32s ease,border-color .32s ease,box-shadow .32s ease}
.nav.solid{background:rgba(255,255,255,.96);backdrop-filter:saturate(160%) blur(12px);
  border-bottom-color:var(--line);box-shadow:0 2px 14px rgba(42,26,62,.07)}
.nav-shell{display:flex;align-items:stretch;width:100%}
.nav-home{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;
  padding:22px clamp(14px,1.4vw,22px);background:none;border:0;
  border-right:1px solid rgba(255,255,255,.14);cursor:pointer;
  font-family:var(--text);font-size:13px;font-weight:700;
  color:rgba(255,255,255,.80);white-space:nowrap;
  transition:color .2s,background .2s,border-color .32s}
.nav-home i{font-style:normal;font-size:15px;transition:transform .2s}
.nav-home:hover{color:#fff;background:rgba(255,255,255,.12)}
.nav-home:hover i{transform:translateX(-3px)}
.nav-home:focus-visible{outline:3px solid var(--lime);outline-offset:-3px}
.nav.solid .nav-home{color:var(--grey);border-right-color:var(--line)}
.nav.solid .nav-home:hover{color:var(--purple);background:var(--tint)}
.nav-shell.wrapped .nav-home{padding-top:16px;padding-bottom:16px}
.nav-mobile .nav-home{padding:6px 10px;border-right:0;font-size:15px}
.nav-mobile .nav-home span{display:none}
@media(max-width:900px){
  .nav-shell{display:block}
  .nav-shell > .nav-home{display:none}
}
.nav-row{display:flex;flex-wrap:wrap;width:100%}
.nav-tab{flex:1 1 auto;max-width:100%;position:relative;cursor:pointer;
  text-align:center;white-space:nowrap;font-family:var(--text);
  font-size:clamp(13px,1.15vw,16px);font-weight:700;letter-spacing:-.005em;
  color:rgba(255,255,255,.86);padding:22px clamp(8px,1.6vw,26px);
  background:none;border:0;border-right:1px solid rgba(255,255,255,.14);
  transition:color .2s,background .2s,border-color .32s}
.nav-tab:last-child{border-right:0}
.nav-tab:hover{color:#fff;background:rgba(255,255,255,.12)}
.nav-tab.active{color:#fff;background:rgba(255,255,255,.14)}
.nav-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;
  height:4px;background:var(--green)}
.nav-tab:focus-visible{outline:3px solid var(--lime);outline-offset:-3px}
.nav.solid .nav-tab{color:var(--grey);border-right-color:var(--line)}
.nav.solid .nav-tab:hover,.nav.solid .nav-tab.active{color:var(--purple);
  background:var(--tint)}
.nav-row.wrapped{justify-content:center}
.nav-row.wrapped .nav-tab{flex-grow:0;padding-top:16px;padding-bottom:16px;
  border-top:1px solid rgba(255,255,255,.10)}
.nav.solid .nav-row.wrapped .nav-tab{border-top-color:var(--line)}
.nav-mobile{display:none;align-items:center;justify-content:space-between;
  gap:14px;padding:14px var(--gut)}
.nav-current{font-family:var(--text);font-size:14px;font-weight:700;color:#fff}
.nav.solid .nav-current{color:var(--purple)}
.nav-burger{width:34px;height:26px;background:none;border:0;cursor:pointer;
  display:grid;align-content:center;gap:5px;padding:0}
.nav-burger span{display:block;height:2px;background:#fff;border-radius:2px;
  transition:transform .25s,opacity .25s}
.nav.solid .nav-burger span{background:var(--purple)}
.nav.open .nav-burger span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav.open .nav-burger span:nth-child(2){opacity:0}
.nav.open .nav-burger span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
@media(max-width:900px){
  .nav-mobile{display:flex}
  .nav-row{position:absolute;left:0;right:0;top:100%;flex-direction:column;
    background:#fff;border-bottom:1px solid var(--line);
    box-shadow:0 18px 40px rgba(42,26,62,.16);
    max-height:0;overflow:hidden;transition:max-height .3s ease}
  .nav.open .nav-row{max-height:70vh;overflow-y:auto}
  .nav-tab{flex:none;text-align:left;padding:17px var(--gut);color:var(--grey);
    border-right:0;border-bottom:1px solid var(--line)}
  .nav-tab:hover,.nav-tab.active{color:var(--purple);background:var(--tint)}
  .nav-tab.active::after{left:0;right:auto;top:0;bottom:0;width:4px;height:auto}
}
.tabview{display:block}

/* ------------------------------------------------------- 6. TAB HERO + BODY */
.hero{position:relative;background:var(--ink);overflow:hidden;
  padding:calc(var(--navh) + clamp(48px,6vw,92px)) 0 clamp(44px,5.5vw,76px)}
.hero-in{padding:0 var(--gut);max-width:1100px}
.hero .eyebrow{color:rgba(255,255,255,.56);display:block;margin-bottom:14px}
.hero-t{font-family:var(--disp);font-weight:900;font-size:clamp(31px,4.8vw,64px);
  line-height:1.04;letter-spacing:-.028em;color:#fff;margin:0 0 14px;
  text-wrap:balance}
.hero-l{font-family:var(--text);font-size:clamp(15px,1.35vw,18px);
  line-height:1.55;color:rgba(255,255,255,.74);max-width:70ch;margin:0}
.sect{padding:clamp(50px,6.5vw,86px) 0}
.sect.tint{background:var(--tint);border-top:1px solid var(--line);
  border-bottom:1px solid var(--line)}
.sect.contd{padding-top:0}
.sect.tint.contd{border-top:0}
.pad{padding-left:var(--gut);padding-right:var(--gut)}
.sect-head{margin-bottom:34px;max-width:74ch}
.sect-sub{font-family:var(--text);font-size:16px;line-height:1.55;
  color:var(--grey);margin:10px 0 0}
.sect{scroll-margin-top:calc(var(--navh) + 12px)}

/* ------------------------------------------------------- 7. BLOCKS: CARDS */
.gcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:16px}
.gcard{background:#fff;border:1px solid var(--line);
  border-top:3px solid var(--line-d);border-radius:10px;padding:28px;
  transition:border-top-color .2s,transform .2s,box-shadow .2s}
.gcard:hover{border-top-color:var(--green);transform:translateY(-3px);
  box-shadow:0 14px 32px rgba(75,40,109,.09)}
.gcard h4{font-family:var(--disp);font-weight:750;font-size:17.5px;
  letter-spacing:-.018em;color:var(--ink);margin:0 0 8px}
.gcard p{font-family:var(--text);font-size:14px;line-height:1.6;
  color:var(--grey);margin:0}
.gcard a{display:inline-block;margin-top:14px;font-size:13px;font-weight:700;
  color:var(--purple);text-decoration:none}
.gcard a:hover{text-decoration:underline}

/* Stat tiles */
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:14px}
.gstat{background:#fff;border:1px solid var(--line);
  border-left:3px solid var(--purple);border-radius:10px;padding:24px}
.gstat b{display:block;font-family:var(--disp);font-weight:900;
  font-size:clamp(26px,3vw,38px);line-height:1;letter-spacing:-.026em;
  color:var(--purple);margin-bottom:9px}
.gstat span{font-family:var(--text);font-size:13px;line-height:1.45;
  color:var(--grey)}

/* ------------------------------------------------ 8. BLOCKS: NUMBERED GRIDS */
.ginsights{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.ginsight{position:relative;display:flex;flex-direction:column;background:#fff;
  border:1px solid var(--line);border-radius:14px;padding:44px 22px 22px;
  overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.ginsight::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:var(--purple);transform:scaleX(0);transform-origin:left;
  transition:transform .28s ease}
.ginsight:hover{transform:translateY(-4px);border-color:var(--line-d);
  box-shadow:0 16px 36px rgba(75,40,109,.10)}
.ginsight:hover::before{transform:scaleX(1)}
.gi-badge{position:absolute;top:14px;left:16px;display:grid;place-items:center;
  min-width:26px;height:26px;padding:0 7px;border-radius:7px;
  background:var(--tint2);color:var(--purple);font-family:var(--micro);
  font-size:11px;font-weight:500;letter-spacing:.06em;
  font-variant-numeric:tabular-nums;transition:background .2s,color .2s}
.ginsight:hover .gi-badge{background:var(--purple);color:#fff}
.gi-top{padding-bottom:13px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.gi-top h4{font-family:var(--disp);font-weight:750;font-size:15.5px;
  line-height:1.25;letter-spacing:-.016em;color:var(--ink);margin:0}
.gi-split{display:grid;grid-template-columns:minmax(72px,38%) minmax(0,1fr);
  gap:14px;align-items:start;flex:1}
.gi-fig{font-family:var(--disp);font-weight:900;font-size:clamp(20px,1.55vw,25px);
  line-height:1.06;letter-spacing:-.028em;color:var(--purple);
  overflow-wrap:break-word}
.gi-fig.long{font-size:clamp(15px,1.15vw,17.5px);line-height:1.25;
  letter-spacing:-.014em;padding-top:2px}
.gi-body{font-family:var(--text);font-size:13.2px;line-height:1.55;
  color:var(--grey);margin:0}
.ginsight.hot{background:var(--tint);border-color:#DCCDEC}
.ginsight.hot::before{background:var(--green);transform:scaleX(1)}
.ginsight.hot .gi-badge{background:var(--purple);color:#fff}
.ginsight.hot .gi-top{border-bottom-color:#DCCDEC}
@media(max-width:1180px){.ginsights{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.ginsights{grid-template-columns:1fr}}

.gbentos{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.gbento{position:relative;display:grid;grid-template-columns:auto 1fr;gap:18px;
  align-items:start;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:clamp(22px,2.2vw,30px);overflow:hidden;
  transition:transform .2s,box-shadow .2s,border-color .2s}
.gbento::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:var(--purple);transform:scaleX(0);transform-origin:left;
  transition:transform .28s ease}
.gbento:hover{transform:translateY(-3px);border-color:var(--line-d);
  box-shadow:0 16px 36px rgba(75,40,109,.10)}
.gbento:hover::before{transform:scaleX(1)}
.gbento-n{font-family:var(--disp);font-weight:900;font-size:clamp(26px,2.4vw,34px);
  line-height:1;letter-spacing:-.03em;color:var(--purple);opacity:.26;
  font-variant-numeric:tabular-nums;user-select:none}
.gbento:hover .gbento-n{opacity:.42}
.gbento p{font-family:var(--text);font-size:15px;line-height:1.62;
  color:var(--ink);margin:0;min-width:0}
@media(max-width:820px){.gbentos{grid-template-columns:1fr}}

.steps{list-style:none;display:grid;gap:12px;margin:0;padding:0}
.step{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;
  background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 24px}
.step-n{display:grid;place-items:center;width:38px;height:38px;border-radius:9px;
  background:var(--tint2);color:var(--purple);font-family:var(--disp);
  font-weight:900;font-size:15px;font-variant-numeric:tabular-nums}
.step h4{font-family:var(--disp);font-weight:750;font-size:16.5px;
  letter-spacing:-.016em;color:var(--ink);margin:0 0 6px}
.step p{font-family:var(--text);font-size:14px;line-height:1.6;
  color:var(--grey);margin:0}

/* ------------------------------------------------------- 9. BLOCKS: TABLES */
.gt-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;
  background:#fff}
.gt{width:100%;border-collapse:collapse;min-width:min(720px,100%)}
.gt th{font-family:var(--micro);font-size:10.5px;font-weight:500;
  letter-spacing:.11em;text-transform:uppercase;color:#fff;
  background:var(--purple);padding:14px 16px;text-align:left;white-space:nowrap}
.gt td{font-family:var(--text);font-size:13.6px;color:var(--ink);
  padding:13px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.gt td:first-child{white-space:normal;min-width:180px}
.gt td.num{font-variant-numeric:tabular-nums}
.gt tbody tr:last-child td{border-bottom:0}
.gt tbody tr{transition:background .14s}
.gt tbody tr:hover{background:var(--tint)}
.gt td.gt-prose{white-space:normal;min-width:0;max-width:420px;
  line-height:1.5;font-size:13.2px}
.gt th.gt-prose{white-space:normal}
.gt.gt-wide th{white-space:normal;padding:12px 10px;line-height:1.25}
.gt.gt-wide td{padding:11px 10px}
.gt.gt-wide td:first-child{min-width:150px}
.gt tr.row-hi td{background:var(--tint2)}
.gt tr.row-hi td:first-child{box-shadow:inset 3px 0 0 var(--purple)}
.gt .hi{color:var(--purple);font-weight:700}
.pbadge{display:inline-block;font-family:var(--micro);font-size:9.5px;
  font-weight:500;letter-spacing:.11em;text-transform:uppercase;
  padding:4px 10px;border-radius:100px;white-space:nowrap}
.pbadge.ok{background:#EEF7E0;color:#4B8500}
.pbadge.warn{background:#FFF3CD;color:#856404}
.pbadge.bad{background:#F8D7DA;color:#721C24}
.pbadge.info{background:var(--tint2);color:var(--purple)}
.pbadge.new{background:var(--purple);color:#fff}
.pbadge.todo{background:#fff;color:var(--grey);border:1px dashed var(--line-d);
  padding:3px 9px}

/* ------------------------------------------- 10. PROGRESSIVE DISCLOSURE */
.swap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.swap-bar{display:flex;flex-wrap:wrap;gap:8px;padding:14px;
  background:var(--tint);border-bottom:1px solid var(--line)}
.swap-b{font-family:var(--text);font-size:13px;font-weight:700;
  color:var(--grey);background:#fff;border:1px solid var(--line-d);
  border-radius:100px;padding:8px 16px;cursor:pointer;
  transition:background .2s,color .2s,border-color .2s}
.swap-b:hover{color:var(--purple);border-color:var(--purple)}
.swap-b.on{background:var(--purple);border-color:var(--purple);color:#fff}
.swap-b:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.swap-p{display:none;padding:20px}
.swap-p.on{display:block;animation:fadeIn .28s ease}
.swap-p .gt-wrap{border:0;border-radius:0}

.gexps{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.gexp{position:relative;background:#fff;border:1px solid var(--line);
  border-radius:14px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.gexp:hover{border-color:var(--line-d);box-shadow:0 14px 32px rgba(75,40,109,.09)}
.gexp.on{border-color:#DCCDEC;box-shadow:0 16px 36px rgba(75,40,109,.11)}
.gexp-hd{display:block;width:100%;text-align:left;background:none;border:0;
  padding:26px 56px 24px 26px;cursor:pointer}
.gexp-t{display:block;font-family:var(--disp);font-weight:750;font-size:17.5px;
  letter-spacing:-.018em;color:var(--ink);margin-bottom:9px}
.gexp-s{display:block;font-family:var(--text);font-size:14px;line-height:1.6;
  color:var(--grey)}
.gexp-i{position:absolute;top:29px;right:26px;width:11px;height:11px;
  border-right:2px solid var(--purple);border-bottom:2px solid var(--purple);
  transform:rotate(45deg);transition:transform .3s ease}
.gexp.on .gexp-i{transform:rotate(-135deg)}
.gexp-hd:focus-visible{outline:3px solid var(--lime);outline-offset:-3px}
.gexp-p{max-height:0;overflow:hidden;transition:max-height .34s ease}
.gexp-p p{font-family:var(--text);font-size:14px;line-height:1.68;
  color:var(--grey);margin:0;padding:20px 26px 26px;
  border-top:1px solid var(--line)}
.gexp.on .gexp-p p{border-top-color:#DCCDEC}

/* ----------------------------------------------------------- 11. CALLOUT */
.gnote{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,3vw,34px);
  align-items:start;padding:clamp(28px,3.5vw,44px);border-radius:16px;
  background:linear-gradient(135deg,var(--ink),#3B2454)}
.dsr-icon{display:grid;place-items:center;width:44px;height:44px;
  border-radius:50%;background:var(--lime);color:var(--ink);
  font-family:var(--disp);font-weight:900;font-size:20px}
.gnote-h{font-family:var(--disp);font-weight:900;font-size:clamp(20px,2.2vw,29px);
  line-height:1.14;letter-spacing:-.022em;color:#fff;margin:0 0 10px}
.gnote-p{font-family:var(--text);font-size:15px;line-height:1.62;
  color:rgba(255,255,255,.86);margin:0;max-width:80ch}

/* -------------------------------------------------- 12. SCROLL BUTTON */
.scroll-btn{position:fixed;right:clamp(16px,2.5vw,34px);
  bottom:clamp(16px,2.5vw,34px);z-index:70;
  font-family:var(--text);font-size:13px;font-weight:700;color:#fff;
  background:var(--purple);border:0;border-radius:100px;padding:13px 22px;
  cursor:pointer;display:inline-flex;align-items:center;gap:9px;
  box-shadow:0 10px 28px rgba(75,40,109,.28);
  opacity:0;pointer-events:none;transform:translateY(10px);
  transition:opacity .26s,transform .26s,background .2s}
.scroll-btn.on{opacity:1;pointer-events:auto;transform:none}
.scroll-btn:hover{background:var(--purple-d)}
.scroll-btn:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
.scroll-btn i{font-style:normal}

/* --------------------------------------------------------- 13. MOTION */
.reveal{opacity:0;transform:translateY(18px);
  transition:opacity .7s cubic-bezier(.2,0,0,1),transform .7s cubic-bezier(.2,0,0,1)}
.reveal.in{opacity:1;transform:none}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  .gr-logo,.gr-word,.gr-place,.gr-ask,.gr-chev{animation:none}
  .gexp-p,.gexp-i{transition:none}
  .swap-p.on{animation:none}
}

/* --------------------------------------- TEAM CARDS */
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.team-card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--line-d);
  border-radius:10px;padding:28px 24px;text-align:center;
  transition:border-top-color .2s,transform .2s,box-shadow .2s}
.team-card:hover{border-top-color:var(--green);transform:translateY(-3px);
  box-shadow:0 14px 32px rgba(75,40,109,.09)}
.team-init{width:56px;height:56px;border-radius:50%;background:var(--tint2);
  color:var(--purple);font-family:var(--disp);font-weight:900;font-size:18px;
  display:grid;place-items:center;margin:0 auto 16px;letter-spacing:-.02em}
.team-name{font-family:var(--disp);font-weight:750;font-size:16px;
  letter-spacing:-.016em;color:var(--ink);margin:0 0 4px}
.team-role{font-family:var(--text);font-size:13px;line-height:1.4;
  color:var(--grey);margin:0 0 4px}
.team-dept{font-family:var(--text);font-size:11.5px;line-height:1.4;
  color:var(--grey);opacity:.7;margin:0 0 12px}
.team-grid--pets .team-init{width:112px;height:112px;font-size:36px}
.pet-card{cursor:pointer}

/* --------------------------------------- ROSTER CARD MODAL */
.modal-box--roster{max-width:340px;padding:0;overflow:hidden;text-align:center}
.rcard-hd{background:var(--purple);color:#fff;padding:10px 16px;
  display:flex;align-items:center;justify-content:space-between;
  font-family:var(--disp);font-weight:900;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.rcard-yr{opacity:.6;font-size:10px;letter-spacing:.1em}
.rcard-close{background:none;border:none;color:#fff;font-size:20px;
  cursor:pointer;padding:0;line-height:1;opacity:.75}
.rcard-close:hover{opacity:1}
.rcard-body{padding:24px 24px 16px}
.rcard-init{width:96px;height:96px;border-radius:50%;background:var(--tint2);
  color:var(--purple);font-family:var(--disp);font-weight:900;font-size:30px;
  display:grid;place-items:center;margin:0 auto 16px;letter-spacing:-.02em}
.rcard-name{font-family:var(--disp);font-weight:800;font-size:18px;
  letter-spacing:-.018em;color:var(--ink);margin:0 0 4px}
.rcard-title{font-family:var(--text);font-size:12.5px;color:var(--grey);
  line-height:1.4;margin:0 0 12px}
.rcard-team{display:inline-block;font-family:var(--text);font-size:10.5px;
  font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.1em;
  background:var(--tint2);padding:3px 12px;border-radius:100px}
.rcard-stats{border-top:2px solid var(--purple)}
.rcard-stat{display:flex;justify-content:space-between;align-items:baseline;
  gap:12px;padding:8px 16px;border-bottom:1px solid var(--line)}
.rstat-lbl{font-family:var(--text);font-size:9px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--grey);white-space:nowrap;flex-shrink:0}
.rstat-val{font-family:var(--text);font-weight:700;font-size:12px;
  color:var(--purple);text-align:right;line-height:1.4;flex:1}
#view-roster .team-card{cursor:pointer}

/* --------------------------------------- PET MODAL */
.modal-box--pet{max-width:580px;max-height:90vh;overflow-y:auto;text-align:center;position:relative}
.pmodal-close{position:absolute;top:14px;right:18px;background:none;border:none;
  font-size:24px;line-height:1;cursor:pointer;color:var(--grey);padding:0}
.pmodal-close:hover{color:var(--ink)}
.pmodal-photo-wrap{width:min(340px,calc(100% - 48px));aspect-ratio:1;border-radius:50%;
  margin:0 auto 20px;overflow:hidden;background:var(--tint2)}
.pmodal-photo{width:100%;height:100%;object-fit:cover;display:block}
.pmodal-emoji{width:100%;height:100%;display:grid;place-items:center;font-size:80px}
.pmodal-role{font-family:var(--text);font-size:14px;font-weight:600;
  color:var(--purple);margin:0 0 4px}
.pmodal-bio{font-family:var(--text);font-size:14px;line-height:1.6;
  color:var(--grey);margin:16px 0 0;text-align:left;
  border-top:1px solid var(--line);padding-top:16px}
.team-email{font-family:var(--text);font-size:12.5px;font-weight:600;
  color:var(--purple);text-decoration:none}
.team-email:hover{text-decoration:underline}

/* --------------------------------------- ORG CHART */
.org-wrap{overflow-x:auto;padding-bottom:8px}
.org-tree{display:flex;flex-direction:column;align-items:center;gap:0;
  min-width:max-content;padding:0 var(--gut)}
.org-node{display:flex;flex-direction:column;align-items:center;position:relative}
.org-card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--purple);
  border-radius:10px;padding:16px 20px;text-align:center;min-width:160px;max-width:200px;
  position:relative;z-index:1}
.org-card strong{display:block;font-family:var(--disp);font-weight:750;font-size:14px;
  letter-spacing:-.014em;color:var(--ink);margin-bottom:3px}
.org-card span{display:block;font-family:var(--text);font-size:12px;
  color:var(--grey);line-height:1.35}
/* Connector line from parent card down */
.org-node::before{content:"";display:block;width:2px;height:28px;
  background:var(--line-d);margin:0 auto}
.org-root > .org-node::before{display:none}
/* Horizontal row of children */
.org-children{display:flex;gap:24px;align-items:flex-start;
  position:relative;padding-top:0}
/* Top horizontal line spanning all children */
.org-children::before{content:"";position:absolute;top:0;left:50%;right:50%;
  height:2px;background:var(--line-d);transform:translateX(-50%);
  width:calc(100% - 100px)}
.org-spacer{height:28px}

/* --------------------------------------- LINKS HUB */
.links-section{margin-bottom:clamp(32px,4vw,52px)}
.links-section .eyebrow{display:block;margin-bottom:18px;padding-bottom:10px;
  border-bottom:1px solid var(--line)}
.links-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.link-card{display:flex;align-items:flex-start;gap:14px;
  background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:20px;text-decoration:none;
  transition:border-color .2s,transform .2s,box-shadow .2s}
.link-card:hover{border-color:var(--purple);transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(75,40,109,.08)}
.link-icon{width:38px;height:38px;border-radius:8px;background:var(--tint2);
  display:grid;place-items:center;flex-shrink:0;font-size:18px}
.link-body{min-width:0}
.link-title{font-family:var(--disp);font-weight:700;font-size:14px;
  letter-spacing:-.012em;color:var(--ink);margin:0 0 3px;display:block}
.link-desc{font-family:var(--text);font-size:12.5px;line-height:1.45;
  color:var(--grey);margin:0}
.link-desc code{font-size:11px;background:var(--tint2);padding:1px 5px;border-radius:4px}
.link-card--info{cursor:default}
.link-card--info:hover{border-color:var(--line);transform:none;box-shadow:none}
.links-note{font-family:var(--text);font-size:12.5px;color:var(--grey);
  margin:-4px 0 14px;line-height:1.5}

/* --------------------------------------- ARCADE */
.arcade-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.arcade-card{display:block;text-decoration:none;color:inherit;
  border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;
  transition:transform .2s cubic-bezier(.2,0,0,1),box-shadow .2s cubic-bezier(.2,0,0,1),border-color .2s}
.arcade-card:hover{transform:translateY(-4px);border-color:var(--purple);
  box-shadow:0 14px 36px rgba(75,40,109,.13)}
.arcade-banner{height:170px;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden}
.arcade-banner::before{content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,rgba(255,255,255,.07) 1px,transparent 1px);
  background-size:18px 18px}
.arcade-banner-icon{font-size:66px;position:relative;
  filter:drop-shadow(0 4px 18px rgba(0,0,0,.45))}
.arcade-banner--racer{background:linear-gradient(135deg,#1c0a35 0%,#4B286D 55%,#7a4b9e 100%)}
.arcade-banner--runner{background:linear-gradient(135deg,#0a2410 0%,#1b6b3a 55%,#3aa063 100%)}
.arcade-banner--frogger{background:linear-gradient(135deg,#0a1828 0%,#1a4a72 55%,#2e7ab0 100%)}
.arcade-body{padding:18px 20px 20px}
.arcade-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.arcade-name{font-family:var(--disp);font-weight:800;font-size:14px;
  letter-spacing:-.012em;color:var(--ink)}
.arcade-play{font-family:var(--micro);font-size:10px;font-weight:700;
  color:var(--purple);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
  transition:color .2s}
.arcade-card:hover .arcade-play{color:var(--green)}
.arcade-desc{font-family:var(--text);font-size:12.5px;color:var(--grey);
  line-height:1.5;margin:0}
.arcade-tags{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.arcade-tag{font-family:var(--micro);font-size:10px;font-weight:600;
  background:var(--tint2);color:var(--grey-l);border-radius:100px;padding:3px 10px}

/* --------------------------------------- PIPELINE LOADING */
.pipe-loading{padding:clamp(60px,8vw,100px) var(--gut);text-align:center}
.pipe-loading .eyebrow{display:block;margin-bottom:12px}

/* --------------------------------------- ADMIN ACTION BUTTONS */
.action-btn{font-family:var(--text);font-size:12px;font-weight:700;
  padding:5px 12px;border-radius:100px;border:0;cursor:pointer;
  transition:opacity .2s,transform .15s}
.action-btn:hover{opacity:.82;transform:translateY(-1px)}
.action-btn:disabled{opacity:.45;cursor:default;transform:none}
.action-btn.approve{background:var(--tint2);color:var(--purple)}
.action-btn.deny{background:#F8D7DA;color:#721C24}
.confirm-strip{display:none;background:linear-gradient(135deg,var(--ink),#3B2454);
  border-radius:12px;padding:24px 28px;margin-top:20px}
.confirm-strip.on{display:grid;grid-template-columns:1fr auto;
  gap:16px;align-items:center}
.confirm-strip p{font-family:var(--text);font-size:14px;color:rgba(255,255,255,.9);margin:0}
.confirm-strip p strong{color:#fff}
.confirm-btns{display:flex;gap:10px;flex-shrink:0}

/* --------------------------------------- ORG SPACER CENTER LINE */
.org-line{position:relative}
.org-line::after{content:"";position:absolute;top:0;bottom:0;left:50%;
  width:2px;background:var(--line-d);transform:translateX(-50%)}

/* --------------------------------------- PIPELINE STATES */
.pipe-loading{padding:clamp(48px,6vw,80px) 0;text-align:center;
  font-family:var(--text);font-size:15px;color:var(--grey-l)}
.pipe-error{padding:clamp(32px,4vw,52px) 0;text-align:center;
  font-family:var(--text);font-size:14px;color:#B91C1C}
.pipe-empty{padding:clamp(32px,4vw,52px) 0;text-align:center;
  font-family:var(--text);font-size:14px;color:var(--grey-l)}
.pipe-link{margin-top:24px;font-family:var(--text);font-size:13px;
  color:var(--grey)}
.pipe-link a{color:var(--purple);font-weight:600;text-decoration:none}
.pipe-link a:hover{text-decoration:underline}
.pipe-progress{height:8px;background:var(--tint2);border-radius:100px;
  overflow:hidden;margin:24px 0}
.pipe-bar{height:100%;background:var(--green);border-radius:100px;
  transition:width .6s cubic-bezier(.2,0,0,1)}

/* --------------------------------------- ACTION CELL (admin table) */
.action-cell{display:flex;gap:8px;align-items:center}

/* --------------------------------------- MODAL */
.modal-overlay{display:none;position:fixed;inset:0;z-index:1200;
  background:rgba(42,26,62,.6);align-items:center;justify-content:center;
  padding:var(--gut)}
.modal-overlay.open{display:flex;animation:fadeIn .2s both}
.modal-box{background:#fff;border-radius:16px;padding:clamp(24px,4vw,40px);
  max-width:420px;width:100%;box-shadow:0 24px 64px rgba(42,26,62,.22)}
.modal-title{font-family:var(--disp);font-weight:750;font-size:18px;
  letter-spacing:-.018em;color:var(--ink);margin:0 0 16px}
.modal-box p{font-family:var(--text);font-size:14px;line-height:1.55;
  color:var(--grey);margin:0 0 8px}
.modal-note{font-size:13px;color:var(--grey-l)!important}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.btn-ghost{font-family:var(--text);font-size:13px;font-weight:600;
  padding:9px 18px;border-radius:100px;border:1.5px solid var(--line-d);
  background:#fff;color:var(--grey);cursor:pointer;
  transition:border-color .2s,color .2s}
.btn-ghost:hover{border-color:var(--purple);color:var(--purple)}
.btn-primary{font-family:var(--text);font-size:13px;font-weight:700;
  padding:9px 20px;border-radius:100px;border:0;
  background:var(--purple);color:#fff;cursor:pointer;
  transition:background .2s,opacity .2s}
.btn-primary:hover{background:var(--purple-d)}
.btn-primary:disabled{opacity:.5;cursor:default}

/* --------------------------------------- TOAST */
.epb-toast{position:fixed;bottom:clamp(16px,2.5vw,32px);left:50%;
  transform:translateX(-50%) translateY(20px);z-index:300;
  background:var(--ink);color:#fff;font-family:var(--text);
  font-size:13px;font-weight:600;padding:12px 22px;border-radius:100px;
  box-shadow:0 8px 24px rgba(42,26,62,.28);
  opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s}
.epb-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* --- Roster map ----------------------------------------------------------- */
.roster-map-wrap{position:relative;margin-top:4px}
.roster-map-split{display:flex;gap:6px;
  height:calc(100vh - var(--navh) - 140px);min-height:400px;max-height:680px}
.roster-map-split>div{flex:1;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.leaflet-div-icon{background:transparent!important;border:none!important}
.pin-dot{width:36px;height:36px;border-radius:50%;
  background:var(--purple);color:#fff;
  font-size:11px;font-weight:700;font-family:var(--text);
  display:flex;align-items:center;justify-content:center;
  border:2.5px solid var(--green);cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.28);
  transition:transform .15s,opacity .2s}
.pin-dot:hover{transform:scale(1.18)}
.pin-dot.pin-unknown{background:var(--grey-l);border-color:var(--line-d)}
.roster-marker-dim{pointer-events:none!important}
.roster-marker-dim .pin-dot{opacity:.18}
#roster-map-reset{position:absolute;top:12px;right:12px;z-index:1000;
  background:var(--purple);color:#fff;border:none;border-radius:6px;
  padding:7px 16px;font-size:13px;font-weight:600;font-family:var(--text);
  cursor:pointer;display:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#roster-map-reset:hover{background:var(--purple-l)}
.roster-map-split .leaflet-container,
.roster-map-split .leaflet-grab{cursor:default!important}

/* ─── Calendar Cards ──────────────────────────────────────────────────────── */
.cal-group-hd{font-family:var(--disp);font-weight:800;font-size:clamp(13px,1.1vw,15px);
  text-transform:uppercase;letter-spacing:.09em;color:var(--purple);
  padding-bottom:10px;border-bottom:2px solid var(--purple);margin:32px 0 16px}
.cal-group-hd:first-child{margin-top:0}
.cal-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:clamp(14px,2vw,22px);align-items:stretch}
.cal-card{background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:clamp(18px,2.2vw,26px);box-shadow:0 1px 4px rgba(0,0,0,.07);
  min-height:110px;display:flex;flex-direction:column;
  transition:box-shadow .2s,transform .2s,border-color .2s}
.cal-card:hover{box-shadow:0 5px 16px rgba(0,0,0,.11);transform:translateY(-2px);border-color:var(--purple)}
.cal-card-title{font-family:var(--disp);font-weight:900;font-size:clamp(16px,1.8vw,20px);
  line-height:1.25;letter-spacing:-.02em;color:var(--purple);margin:0 0 8px}
.cal-card-datetime{font-size:clamp(12px,1vw,13px);color:var(--grey);margin-bottom:12px;line-height:1.4}
.cal-card-badge{}
.cal-card-loading,.cal-card-empty,.cal-card-error{
  padding:clamp(32px,6vw,52px) var(--gut);text-align:center;border-radius:12px;
  border:1px solid var(--line)}
.cal-card-loading .eyebrow,.cal-card-empty .eyebrow,.cal-card-error .eyebrow{display:block;margin-bottom:6px}
.cal-card-empty,.cal-card-error{background:rgba(75,40,109,.03)}
.cal-card-empty p,.cal-card-error p{font-size:13px;color:var(--grey);margin:0}
@media(max-width:600px){.cal-cards{grid-template-columns:1fr}}

/* ─── PulseCheck Countdown ─────────────────────────────────────────────────── */
.pc-countdown{text-align:center;margin-bottom:clamp(28px,3.5vw,44px);
